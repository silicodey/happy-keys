<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keystreet Studio</title>
<meta name="description" content="An explorable keyboard portfolio.">
<meta name="theme-color" content="#0E1530">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0E1530;
  --wash:#F2F0EA;
  --mute:rgba(242,240,234,.66);
  --faint:rgba(242,240,234,.42);
  --hair:rgba(242,240,234,.15);
  --glass:rgba(16,24,52,.56);
  --amber:#FFB867;
  --accent:#5A7BE0;
  --serif:'Instrument Serif','Iowan Old Style',Georgia,serif;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--wash);font-family:var(--sans);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
canvas#gl{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}
canvas#gl.grabbing{cursor:grabbing}
canvas#gl.point{cursor:pointer}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
kbd{font-family:var(--mono);font-weight:500}

/* ── HUD ─────────────────────────────── */
.hud{position:fixed;z-index:5;opacity:0;transition:opacity 1.4s ease .3s;pointer-events:none}
body.live .hud{opacity:1}
body.live .hud.act{pointer-events:auto}
#brand{top:max(22px,env(safe-area-inset-top));left:max(26px,env(safe-area-inset-left))}
#brand .mark{display:block;font-family:var(--serif);font-size:28px;line-height:1;letter-spacing:.005em}
#brand .sub{display:block;margin-top:5px;font-size:12.5px;color:var(--faint)}
#tools{top:max(18px,env(safe-area-inset-top));right:max(22px,env(safe-area-inset-right));display:flex;align-items:center;gap:8px}
.pill{height:40px;border-radius:20px;background:var(--glass);border:1px solid var(--hair);
  backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);display:flex;align-items:center}
.ibtn{width:40px;justify-content:center;cursor:pointer;padding:0;transition:background .3s,border-color .3s}
.ibtn:hover,#idxBtn:hover{background:rgba(30,40,80,.66);border-color:rgba(242,240,234,.3)}
.pill svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#tod{padding:0 14px 0 13px;gap:10px;user-select:none;-webkit-user-select:none}
#tod svg{opacity:.75}
#todTrack{position:relative;width:128px;height:28px;cursor:ew-resize;touch-action:none}
#todTrack::before{content:'';position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;border-radius:2px;
  background:linear-gradient(90deg,#BFD9EA 0%,#F4C08D 40%,#E8906E 62%,#5363A8 78%,#1A2346 100%)}
#todKnob{position:absolute;top:50%;left:64%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--wash);
  box-shadow:0 0 0 4px rgba(242,240,234,.13),0 2px 10px rgba(0,0,0,.45);transition:box-shadow .3s}
#todTrack:hover #todKnob,#todTrack.drag #todKnob{box-shadow:0 0 0 7px rgba(242,240,234,.18),0 2px 12px rgba(0,0,0,.5)}
#todLabel{font-size:12.5px;color:var(--mute);width:74px}
#idxBtn{padding:0 16px 0 14px;gap:9px;cursor:pointer;font-size:13px;transition:background .3s,border-color .3s}
#progress{bottom:max(24px,env(safe-area-inset-bottom));left:max(26px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px}
#dots{display:flex;gap:7px}
#dots i{width:8px;height:8px;border-radius:50%;border:1px solid rgba(242,240,234,.38);transition:background .6s,box-shadow .6s,border-color .6s}
#dots i.on{border-color:transparent}
#ctr{font-size:12.5px;color:var(--mute)}
#hint{bottom:max(26px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:13px;color:var(--mute);
  white-space:nowrap;text-shadow:0 1px 14px rgba(0,0,0,.55);transition:opacity 1s}
#hint.gone{opacity:0 !important}

/* ── cursor tag ─────────────────────── */
#tag{position:fixed;z-index:6;left:0;top:0;pointer-events:none;display:flex;align-items:center;gap:10px;
  padding:7px 8px 7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--hair);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;transform:translate3d(-999px,-999px,0);
  transition:opacity .18s ease;white-space:nowrap}
#tag.on{opacity:1}
#tag .sw{width:8px;height:8px;border-radius:50%}
#tag .nm{font-family:var(--serif);font-size:19px;line-height:1}
#tag kbd{font-size:10.5px;padding:3px 7px;border-radius:6px;background:rgba(242,240,234,.1);color:var(--mute)}

/* ── project panel ──────────────────── */
#panel{position:fixed;z-index:7;top:max(78px,calc(env(safe-area-inset-top) + 66px));right:max(22px,env(safe-area-inset-right));
  bottom:max(22px,env(safe-area-inset-bottom));width:min(440px,37vw);border-radius:24px;
  background:linear-gradient(180deg,rgba(18,26,56,.70),rgba(10,15,34,.80));border:1px solid var(--hair);
  backdrop-filter:blur(26px) saturate(1.35);-webkit-backdrop-filter:blur(26px) saturate(1.35);
  box-shadow:0 40px 90px rgba(3,6,18,.5);overflow:hidden;display:flex;flex-direction:column;
  opacity:0;transform:translateX(28px) scale(.985);pointer-events:none;
  transition:opacity .5s var(--ease),transform .8s var(--ease)}
#panel.open{opacity:1;transform:none;pointer-events:auto}
#panel .halo{position:absolute;top:-170px;right:-150px;width:380px;height:380px;border-radius:50%;
  background:radial-gradient(circle,var(--accent) 0%,transparent 66%);opacity:.26;pointer-events:none;transition:background .7s}
#panel .scroll{position:relative;flex:1;overflow-y:auto;padding:30px 32px 22px;scrollbar-width:thin;scrollbar-color:rgba(242,240,234,.2) transparent}
#panel .top{display:flex;align-items:center;gap:11px;font-size:13px;color:var(--mute)}
#panel .top kbd{font-size:11px;min-width:30px;text-align:center;padding:4px 8px;border-radius:7px;color:#fff;
  background:var(--accent);box-shadow:0 0 22px var(--accent),inset 0 -2px 0 rgba(0,0,0,.25)}
#panel h2{font-family:var(--serif);font-weight:400;font-size:clamp(46px,4.6vw,66px);line-height:.95;letter-spacing:-.012em;margin:20px 0 12px}
#panel .lede{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.28;color:rgba(242,240,234,.88);margin:0 0 22px;max-width:30ch}
#panel .body p{font-size:15px;line-height:1.68;color:rgba(242,240,234,.74);margin:0 0 14px;max-width:62ch}
#panel dl{margin:22px 0 0;padding:0;border-top:1px solid var(--hair)}
#panel dl div{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid var(--hair);font-size:14px}
#panel dt{color:var(--faint)}
#panel dd{margin:0;text-align:right;color:var(--wash)}
#panel .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
#panel .tags span{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(242,240,234,.07);color:var(--mute)}
#panel .visit{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:13px 20px;border-radius:999px;background:var(--wash);
  color:var(--night);text-decoration:none;font-size:14px;font-weight:600;transition:gap .4s var(--ease),box-shadow .4s}
#panel .visit svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#panel .visit:hover{gap:15px;box-shadow:0 0 0 5px rgba(242,240,234,.13)}
#panel .foot{position:relative;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--hair);font-size:13px}
#panel .foot button{display:inline-flex;align-items:center;gap:7px;background:none;border:0;cursor:pointer;color:var(--mute);padding:8px 10px;border-radius:10px;transition:color .25s,background .25s}
#panel .foot button:hover{color:var(--wash);background:rgba(242,240,234,.07)}
#panel .foot svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#panel .foot kbd{font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(242,240,234,.08)}
#panel .fx{opacity:0;transform:translateY(12px)}
#panel.show .fx{opacity:1;transform:none;transition:opacity .6s ease var(--d),transform .9s var(--ease) var(--d)}

/* ── index ──────────────────────────── */
#index{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(8,12,28,.6);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s}
#index.open{opacity:1;visibility:visible}
#index .wrap{width:min(720px,100%)}
#index .kick{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--mute);margin:0 0 18px}
#index ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--hair)}
#index li{border-bottom:1px solid var(--hair)}
#index li button{width:100%;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:18px;padding:16px 6px;
  background:none;border:0;cursor:pointer;text-align:left;transition:padding .5s var(--ease)}
#index li button:hover{padding-left:18px}
#index .k{font-family:var(--mono);font-size:11px;text-align:center;padding:5px 0;border-radius:7px;color:#fff}
#index .n{font-family:var(--serif);font-size:clamp(30px,4.4vw,46px);line-height:1}
#index .c{font-size:13px;color:var(--faint)}
#index .done .n::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--wash);opacity:.5;margin-left:14px;vertical-align:middle}
#idxClose{margin-top:22px;background:none;border:1px solid var(--hair);border-radius:999px;padding:11px 18px;cursor:pointer;color:var(--mute);font-size:13px}
#idxClose:hover{color:var(--wash);border-color:rgba(242,240,234,.3)}

/* ── intro ──────────────────────────── */
#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;padding:28px;
  background:radial-gradient(130% 90% at 50% 105%,#E8906E 0%,#5A5C9C 26%,#1E2856 52%,#0B1128 100%);
  transition:opacity 1.8s ease,visibility 1.8s}
#intro.gone{opacity:0;visibility:hidden}
#intro .kick{font-size:14px;color:var(--faint);margin:0}
#intro h1{font-family:var(--serif);font-weight:400;font-size:clamp(64px,12vw,150px);line-height:.86;margin:18px 0 18px;letter-spacing:-.025em}
#intro .line{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2.4vw,27px);color:var(--mute);margin:0 auto;max-width:28ch}
#intro .load{margin:38px auto 0;width:150px;height:1px;background:var(--hair);overflow:hidden;transition:opacity .6s}
#intro .load i{display:block;height:100%;background:var(--wash);transform-origin:left;transform:scaleX(0);transition:transform .5s ease}
#intro.ready .load{opacity:0}
#intro .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:-1px;opacity:0;transform:translateY(10px);transition:opacity .9s,transform .9s var(--ease);pointer-events:none}
#intro.ready .row{opacity:1;transform:none;pointer-events:auto}
#intro .go{padding:15px 26px;border-radius:999px;border:0;background:var(--wash);color:var(--night);font-size:15px;font-weight:600;cursor:pointer;transition:box-shadow .4s}
#intro .go:hover{box-shadow:0 0 0 6px rgba(242,240,234,.14)}
#intro .quiet{padding:15px 22px;border-radius:999px;border:1px solid var(--hair);background:none;color:var(--mute);font-size:15px;cursor:pointer;transition:color .3s,border-color .3s}
#intro .quiet:hover{color:var(--wash);border-color:rgba(242,240,234,.34)}
#intro .note{margin:22px 0 0;font-size:13px;color:var(--faint);opacity:0;transition:opacity 1s .3s}
#intro.ready .note{opacity:1}

#intro .err{display:none;margin:30px auto 0;max-width:560px;text-align:left;padding:20px 24px;border-radius:16px;
  background:rgba(10,14,32,.55);border:1px solid rgba(255,140,120,.4);font-size:14px;line-height:1.55}
#intro .err .eh{margin:0 0 10px;font-weight:600}
#intro .err ul{margin:0;padding-left:18px;color:var(--mute)}
#intro .err li{margin:4px 0}
#intro .err .ef{margin:12px 0 0;color:var(--faint);font-size:13px}
#intro.broken .err{display:block}
#intro.broken .row,#intro.broken .load,#intro.broken .note{display:none}

@media (max-width:820px){
  #brand .mark{font-size:22px}
  #brand .sub{display:none}
  #todLabel{display:none}
  #todTrack{width:84px}
  #idxBtn .lbl{display:none}
  #idxBtn{width:40px;padding:0;justify-content:center}
  #ctr{display:none}
  #hint{font-size:12px;bottom:max(64px,calc(env(safe-area-inset-bottom) + 44px))}
  #panel{left:10px;right:10px;top:auto;bottom:max(10px,env(safe-area-inset-bottom));width:auto;max-height:64vh;border-radius:22px;transform:translateY(34px)}
  #panel .scroll{padding:24px 22px 16px}
  #panel h2{font-size:44px;margin-top:14px}
  #panel .lede{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important}
}
</style>
</head>
<body>
<noscript><p style="padding:24px">This portfolio is an interactive 3D scene and needs JavaScript.</p></noscript>

<div id="tag" aria-hidden="true"><span class="sw"></span><span class="nm"></span><kbd></kbd></div>

<header class="hud" id="brand">
  <span class="mark" id="brandName"></span>
  <span class="sub" id="brandSub"></span>
</header>

<div class="hud act" id="tools">
  <div class="pill" id="tod" role="group" aria-label="Time of day">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
    <div id="todTrack" role="slider" tabindex="0" aria-label="Time of day" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64"><span id="todKnob"></span></div>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4 8.2 8.2 0 1 0 20 14.6z"/></svg>
    <span id="todLabel">Blue hour</span>
  </div>
  <button class="pill ibtn" id="sndBtn" aria-label="Turn sound off" aria-pressed="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path id="sndWave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/><path id="sndX" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/></svg>
  </button>
  <button class="pill" id="idxBtn" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg><span class="lbl">Index</span>
  </button>
</div>

<div class="hud" id="progress"><div id="dots" aria-hidden="true"></div><span id="ctr"></span></div>
<div class="hud" id="hint">Drag to look around, scroll to move in, click a glowing key. Or just type.</div>

<aside id="panel" aria-hidden="true" aria-labelledby="pName">
  <div class="halo"></div>
  <div class="scroll" id="pScroll">
    <div class="top fx"><kbd id="pKey"></kbd><span id="pCat"></span></div>
    <h2 class="fx" id="pName"></h2>
    <p class="lede fx" id="pLede"></p>
    <div class="body fx" id="pBody"></div>
    <dl class="fx" id="pFacts"></dl>
    <div class="tags fx" id="pTags"></div>
    <a class="visit fx" id="pVisit" target="_blank" rel="noopener"><span id="pVisitTx"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16L16 8M9.5 8H16v6.5"/></svg></a>
  </div>
  <nav class="foot" aria-label="Project navigation">
    <button id="pPrev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5L9 12l5.5 5.5"/></svg>Previous</button>
    <button id="pClose">Close <kbd>esc</kbd></button>
    <button id="pNext">Next<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6.5L15 12l-5.5 5.5"/></svg></button>
  </nav>
</aside>

<div id="index" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Project index">
  <div class="wrap">
    <p class="kick" id="idxKick"></p>
    <ol id="idxList"></ol>
    <button id="idxClose">Back to the keyboard</button>
  </div>
</div>

<div id="intro">
  <div>
    <p class="kick" id="introKick"></p>
    <h1 id="introName"></h1>
    <p class="line" id="introLine"></p>
    <div class="load"><i id="loadBar"></i></div>
    <div class="row">
      <button id="goSound" class="go">Enter with sound</button>
      <button id="goQuiet" class="quiet">Enter quietly</button>
    </div>
    <p class="note">Drag to look around. Your own keyboard plays this one too.</p>
    <div class="err" id="introErr" role="alert"></div>
  </div>
</div>

<script type="application/json" id="portfolio"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
'use strict';

/* ════════════════════════════════════════════════════════════
   ENVIRONMENT + SMALL UTILITIES
   ════════════════════════════════════════════════════════════ */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COARSE  = matchMedia('(pointer: coarse)').matches;
const MOBILE  = COARSE || innerWidth <= 820;
const HAS_POST = !!(THREE.EffectComposer && THREE.RenderPass && THREE.ShaderPass &&
                    THREE.UnrealBloomPass && THREE.CopyShader && THREE.LuminosityHighPassShader);
const $ = id => document.getElementById(id);
const V3 = THREE.Vector3;

const clamp  = (v,a,b) => v < a ? a : (v > b ? b : v);
const lerp   = (a,b,t) => a + (b - a) * t;
const smooth = (a,b,x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
function rng(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R  = rng(80826);                 // deterministic: same village every visit
const rr = (a,b) => a + R() * (b - a);
const col = hex => new THREE.Color(hex).convertSRGBToLinear();

function hash2(x,y){ const s = Math.sin(x*127.1 + y*311.7) * 43758.5453123; return s - Math.floor(s); }
function vnoise(x,y,P){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf*xf*(3 - 2*xf), v = yf*yf*(3 - 2*yf);
  const h = (a,b) => { if (P){ a = ((a % P) + P) % P; b = ((b % P) + P) % P; } return hash2(a,b); };
  return lerp(lerp(h(xi,yi), h(xi+1,yi), u), lerp(h(xi,yi+1), h(xi+1,yi+1), u), v) * 2 - 1;
}
function fbm(x,y,P){ let s = 0, a = 0.5, f = 1; for (let i = 0; i < 4; i++){ s += a * vnoise(x*f, y*f, P ? P*f : 0); f *= 2; a *= 0.5; } return s; }

/* ════════════════════════════════════════════════════════════
   LAYOUT — a tenkeyless board. A lane runs through the middle:
   any key that overlaps it was swallowed by the village.
   [id, legend, x (units), width (units), kind: a = alpha, m = modifier]
   ════════════════════════════════════════════════════════════ */
const LAYOUT = [
  [['esc','esc',0,1,'m'],['F1','F1',2,1,'a'],['F2','F2',3,1,'a'],['F3','F3',4,1,'a'],['F4','F4',5,1,'a'],

/* ════════════════════════════════════════════════════════════
   PORTFOLIO LOADER — reads the portfolio, checks it, fills gaps,
   and explains problems in plain words instead of a blank screen
   ════════════════════════════════════════════════════════════ */
const MINIATURES = ['house','vault','forge','orbit','ledger','blueprint','palette','telescope','compass','loom','ship','sapling','gears','scales','lantern'];
const SETTINGS_INFO = {
  santorini: {label:'Santorini', line:'a small street above the caldera', ready:true},
  kyoto:     {label:'Kyoto', line:'a lantern-lit lane up to the pagoda', ready:true},
  brooklyn:  {label:'Brooklyn', line:'a brownstone block above the river', ready:false},
  lofoten:   {label:'Lofoten', line:'a harbour lane under the northern lights', ready:false}
};
const TOD_NAMES = {afternoon:0.12, golden:0.42, 'golden hour':0.42, blue:0.64, 'blue hour':0.64, night:0.92};
const NUM_WORDS = ['No','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve'];
const FALLBACK_COLORS = ['#E5865A','#9A7DEB','#45A87C','#EAAE45','#6585EA','#33AACB','#DE5C94','#C9A23A','#5FB3A8','#D9705B','#7C93C9','#B7789E'];
const RESERVED_KEYS = new Set(['esc','left','right','up','down']);
const KEY_LABELS = {home:'Home', end:'End', ins:'Ins', del:'Del', pgup:'PgUp', pgdn:'PgDn', prt:'PrtSc', scr:'ScrLk', pau:'Pause'};
const FALLBACK_ORDER = 'ASDFLQWERTOPZXCV1234502'.split('').concat(['F1','F2','F3','F4','F9','F10','F11','F12','home','end','pgup','pgdn','ins','del']);
const MAX_PROJECTS = 12;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isStr = v => typeof v === 'string' && v.trim().length > 0;

/* which keys can hold a project: single-width, not swallowed by the street, not used for navigation */
function usableKeys(){
  const ok = new Map(), swallowed = new Set();
  LAYOUT.forEach((row, r) => {
    const c = LANE_C[r];
    row.forEach(([id, label, x, w]) => {
      if (x < c + LANE_HW && x + w > c - LANE_HW){ swallowed.add(id.toLowerCase()); return; }
      if (w === 1 && !RESERVED_KEYS.has(id)) ok.set(id.toLowerCase(), id);
    });
  });
  return {ok, swallowed};
}

/* Checks a portfolio. In preview (the studio), nothing blocks the scene:
   unusable fields fall back to defaults and each problem is reported
   against the project and field it belongs to. */
function validatePortfolio(raw, opts){
  const preview = !!(opts && opts.preview);
  const errors = [], fields = [];
  const flag = (i, field, msg) => { fields.push({index:i, field, message:msg}); if (!preview) errors.push(msg); };
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {errors:['The portfolio must be a JSON object.'], fields};
  const owner = raw.owner || {}, scene = raw.scene || {}, intro = raw.intro || {};
  const ownerName = isStr(owner.name) ? owner.name.trim() : (preview ? 'Your name' : '');
  if (!ownerName) errors.push('owner.name is missing. Every portfolio needs the name of the person or studio it belongs to.');
  if ((scene.theme || 'keyboard') !== 'keyboard') errors.push('scene.theme "' + scene.theme + '" is not available yet. Available: keyboard.');
  let street = String(scene.setting || scene.street || 'santorini').toLowerCase();
  if (!SETTINGS_INFO[street] || !SETTINGS_INFO[street].ready){
    const ok = Object.keys(SETTINGS_INFO).filter(k => SETTINGS_INFO[k].ready);
    if (preview) street = 'santorini';
    else errors.push('scene.setting "' + street + '" is not available yet. Available: ' + ok.join(', ') + '.');
  }
  let tod = 0.64;
  if (scene.timeOfDay !== undefined){
    const v = scene.timeOfDay;
    if (typeof v === 'number' && v >= 0 && v <= 1) tod = v;
    else if (typeof v === 'string' && TOD_NAMES[v.toLowerCase()] !== undefined) tod = TOD_NAMES[v.toLowerCase()];
    else if (!preview) errors.push('scene.timeOfDay should be a number from 0 to 1, or one of: afternoon, golden, blue, night.');
  }

  const list = Array.isArray(raw.projects) ? raw.projects : (preview ? [] : null);
  if (!list) errors.push('projects is missing. It should be a list of the things you want on the board.');
  else if (list.length === 0 && !preview) errors.push('projects is empty. Add at least one.');
  else if (list.length > MAX_PROJECTS) errors.push('There are ' + list.length + ' projects. The keyboard holds up to ' + MAX_PROJECTS + '; pick your strongest.');
  if (!list || (list.length === 0 && !preview) || list.length > MAX_PROJECTS) return {errors, fields};

  const {ok, swallowed} = usableKeys(), taken = new Map(), items = [];
  list.forEach((p, i) => {
    const where = 'Project ' + (i + 1) + (isStr(p && p.name) ? ' (' + p.name + ')' : '');
    if (!p || typeof p !== 'object'){ flag(i, 'name', where + ' is not an object.'); return; }
    if (!isStr(p.name)){ flag(i, 'name', where + ' needs a name.'); return; }
    const it = {p, key:null, i, url:null, color:null, arche:null};
    if (p.name.length > 40) flag(i, 'name', where + ': the name is longer than 40 characters.');
    if (isStr(p.url)){
      if (/^https?:\/\/[^\s]+\.[^\s]+/i.test(p.url.trim())) it.url = p.url.trim();
      else flag(i, 'url', where + ': the link should be a full web address starting with https://');
    }
    if (p.color != null && p.color !== ''){
      if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(p.color)) it.color = p.color;
      else flag(i, 'color', where + ': color "' + p.color + '" should be a hex colour like #4C6FD1.');
    }
    if (p.miniature != null && p.miniature !== ''){
      if (MINIATURES.indexOf(String(p.miniature).toLowerCase()) >= 0) it.arche = String(p.miniature).toLowerCase();
      else flag(i, 'miniature', where + ': miniature "' + p.miniature + '" is not one of: ' + MINIATURES.join(', ') + '.');
    }
    if (p.key != null && p.key !== ''){
      const k = String(p.key).toLowerCase();
      if (swallowed.has(k)) flag(i, 'key', where + ': the ' + p.key + ' key sits where the street runs through the board. Choose another.');
      else if (!ok.has(k)) flag(i, 'key', where + ': the ' + p.key + ' key cannot hold a project. Use a letter, a digit, an F-key, or Home, End, Ins, Del, PgUp, PgDn.');
      else if (taken.has(k)) flag(i, 'key', where + ': the ' + p.key + ' key is already used by ' + taken.get(k) + '.');
      else { it.key = ok.get(k); taken.set(k, p.name); }
    }
    items.push(it);
  });
  if (errors.length) return {errors, fields};

  /* projects without a key get the first free letter of their own name, then sensible fallbacks */
  for (const it of items){
    if (it.key) continue;
    const cands = it.p.name.toUpperCase().replace(/[^A-Z0-9]/g, '').split('').concat(FALLBACK_ORDER);
    for (const c of cands){ const k = c.toLowerCase(); if (ok.has(k) && !taken.has(k)){ it.key = ok.get(k); taken.set(k, it.p.name); break; } }
    if (!it.key){ errors.push('Ran out of keys for ' + it.p.name + '.'); return {errors, fields}; }
  }

  const products = {}, order = [], keyOf = {}, slotOf = {};
  const txt = (v, max) => isStr(v) ? v.trim().slice(0, max) : '';
  items.forEach(({p, key, i, url, color, arche}) => {
    const body = Array.isArray(p.body) ? p.body.filter(isStr).map(s => s.trim().slice(0, 900)) : (isStr(p.body) ? [p.body.trim().slice(0, 900)] : []);
    const facts = (Array.isArray(p.facts) ? p.facts : []).map(f => Array.isArray(f) ? f : (f && typeof f === 'object' ? [f.label, f.value] : null))
      .filter(f => f && isStr(String(f[0] == null ? '' : f[0])) && f[1] != null && String(f[1]).trim()).slice(0, 6).map(f => [String(f[0]).slice(0, 40), String(f[1]).slice(0, 80)]);
    const tags = (Array.isArray(p.tags) ? p.tags : []).filter(isStr).slice(0, 8).map(t => t.trim().slice(0, 30));
    const label = KEY_LABELS[key] || key;
    products[key] = {key:label, name:p.name.trim(), cat:txt(p.category, 60), color:color || FALLBACK_COLORS[i % FALLBACK_COLORS.length],
      url, arche:arche || 'lantern', lede:txt(p.lede, 160), body, facts, tags};
    slotOf[i] = order.length; order.push(key); keyOf[i] = label;
  });
  const n = order.length, word = NUM_WORDS[n] || String(n);
  const meta = {
    name:ownerName, subtitle:txt(owner.subtitle, 80), title:txt(owner.title, 80) || ownerName + ' | Portfolio',
    description:txt(owner.description, 300) || ownerName + ' — an explorable keyboard portfolio.',
    kicker:txt(intro.kicker, 60) || 'Portfolio',
    line:txt(intro.line, 120) || word + ' glowing ' + (n === 1 ? 'key' : 'keys') + ', and ' + SETTINGS_INFO[street].line + '.',
    indexLine:n ? word + ' ' + (n === 1 ? 'key on this board opens' : 'keys on this board open') + ' something.' : 'Nothing on this board yet.',
    street, tod, introFrom:Math.max(0, tod - 0.18), preview
  };
  return {errors:[], fields, products, order, keyOf, slotOf, meta};
}

function applyMeta(m){
  document.title = m.title;
  const d = document.querySelector('meta[name="description"]'); if (d) d.setAttribute('content', m.description);
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('brandName', m.name); set('brandSub', m.subtitle); set('introKick', m.kicker); set('introName', m.name);
  set('introLine', m.line); set('idxKick', m.indexLine);
  const s = document.getElementById('brandSub'); if (s) s.style.display = m.subtitle ? '' : 'none';
}

function showErrors(list){
  const intro = document.getElementById('intro');
  intro.classList.add('broken');
  const box = document.getElementById('introErr');
  box.innerHTML = '<p class="eh">This portfolio could not be built yet.</p><ul>' + list.map(e => '<li>' + esc(e) + '</li>').join('') +
    '</ul><p class="ef">Fix these in the portfolio and reload.</p>';
  if (window.console) console.warn('[portfolio]', list.join('\n'));
}

function hasPortfolio(el){
  if (!el) return false;
  if (el.getAttribute('data-src')) return true;
  const t = el.textContent.trim();
  return t.length > 0 && t !== '{}';
}

function start(){
  const el = document.getElementById('portfolio');
  if (!hasPortfolio(el)){
    if (window.KeystreetStudio) return window.KeystreetStudio.init(window.Keystreet);
    return showErrors(['This file has no portfolio in it yet. Open it with the studio to build one.']);
  }
  const run = raw => {
    const res = validatePortfolio(raw);
    if (res.errors.length) return showErrors(res.errors);
    applyMeta(res.meta);
    try { boot(res.products, res.order, res.meta); }
    catch (e){ showErrors(['The scene failed to start: ' + e.message]); if (window.console) console.error(e); }
  };
  const src = el.getAttribute('data-src');
  if (src){
    fetch(src).then(r => { if (!r.ok) throw new Error('Could not load ' + src + ' (HTTP ' + r.status + ').'); return r.json(); })
      .then(run).catch(e => showErrors([e.message]));
    return;
  }
  let raw;
  try { raw = JSON.parse(el.textContent); }
  catch (e){ return showErrors(['The portfolio is not valid JSON: ' + e.message]); }
  run(raw);
}

function boot(PRODUCTS, ORDER, META){
/* ════════════════════════════════════════════════════════════

const renderer = new THREE.WebGLRenderer({antialias: !HAS_POST, powerPreference:'high-performance', stencil:false});

let qIdx = 0;
const prFor = i => Math.min(window.devicePixelRatio || 1, QUALITY[i]);

/* ════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════ */
function makeCanvas(w,h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function tileNoise(size, freq, grain){
  const c = makeCanvas(size,size), x = c.getContext('2d'), img = x.createImageData(size,size), d = img.data;
  for (let j = 0; j < size; j++) for (let i = 0; i < size; i++){
    const n = fbm(i/size*freq, j/size*freq, freq);
    const v = clamp(0.5 + n*0.42 + (R() - 0.5)*grain, 0, 1) * 255, o = (j*size + i) * 4;
    d[o] = d[o+1] = d[o+2] = v; d[o+3] = 255;
  }
  x.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
function cloudTexture(){
  const c = makeCanvas(512,256), x = c.getContext('2d');
  for (let i = 0; i < 28; i++){
    const cx = rr(80,432), spread = 1 - Math.abs(cx - 256) / 300;
    const cy = rr(120,165) - spread*22, r = rr(36,92) * Math.max(0.35, spread);
    const g = x.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'rgba(255,255,255,0.5)'); g.addColorStop(0.55,'rgba(255,255,255,0.16)'); g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(cx - r, cy - r, r*2, r*2);
  }
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
}

/* legend atlas: one 2048² canvas, 16×16 cells, redrawn once the web fonts land */
const ATLAS = {cv: makeCanvas(2048,2048), cells:{}, next:0, tex:null};
function atlasCell(text){ if (ATLAS.cells[text] === undefined) ATLAS.cells[text] = ATLAS.next++; return ATLAS.cells[text]; }
function cellUV(i){ const c = i % 16, r = (i / 16) | 0; return {u0:c/16, v0:1 - (r+1)/16, du:1/16, dv:1/16}; }
function drawAtlas(){
  const x = ATLAS.cv.getContext('2d');
  x.clearRect(0,0,2048,2048); x.fillStyle = '#ffffff'; x.textAlign = 'center'; x.textBaseline = 'middle';
  for (const text in ATLAS.cells){
    const i = ATLAS.cells[text], cx = (i % 16)*128 + 64, cy = ((i/16)|0)*128 + 64;
    const single = [...text].length === 1;
    let size = single ? 64 : 38;
    do { x.font = '500 ' + size + 'px "Instrument Sans","Helvetica Neue",Arial,sans-serif';
         if (x.measureText(text).width <= 104) break; size -= 2; } while (size > 14);
    x.fillText(text, cx, cy + 2);
  }
  if (ATLAS.tex) ATLAS.tex.needsUpdate = true;
}

/* ════════════════════════════════════════════════════════════
   GEOMETRY HELPERS
   ════════════════════════════════════════════════════════════ */
function rrect(w,d,r,seg){                     // flat [x,z,...] around a rounded rectangle
  r = Math.min(r, w/2 - 1e-3, d/2 - 1e-3);
  const pts = [], C = [[w/2-r,d/2-r,0],[-w/2+r,d/2-r,Math.PI/2],[-w/2+r,-d/2+r,Math.PI],[w/2-r,-d/2+r,Math.PI*1.5]];
  for (const c of C) for (let i = 0; i <= seg; i++){ const a = c[2] + i/seg*Math.PI/2; pts.push(c[0] + Math.cos(a)*r, c[1] + Math.sin(a)*r); }
  return pts;
}
function roundedRectShape(w,d,r){
  r = Math.min(r, w/2 - 1e-4, d/2 - 1e-4);
  const x = w/2, y = d/2, s = new THREE.Shape();
  s.moveTo(-x + r, -y); s.lineTo(x - r, -y); s.quadraticCurveTo(x, -y, x, -y + r);
  s.lineTo(x, y - r); s.quadraticCurveTo(x, y, x - r, y); s.lineTo(-x + r, y);
  s.quadraticCurveTo(-x, y, -x, y - r); s.lineTo(-x, -y + r); s.quadraticCurveTo(-x, -y, -x + r, -y);
  return s;
}
/* rounded corners + chamfered top/bottom, exactly h tall, centred on the origin */
function chamferBox(w,h,d,r,bev,seg){
  bev = Math.min(bev, h/2 - 0.0005); r = Math.max(r, bev + 0.0005);
  const g = new THREE.ExtrudeGeometry(roundedRectShape(w - 2*bev, d - 2*bev, r - bev), {
    depth: h - 2*bev, bevelEnabled:true, bevelThickness:bev, bevelSize:bev, bevelOffset:0,
    bevelSegments: seg || 3, curveSegments:6, steps:1 });
  g.rotateX(-Math.PI/2);
  g.translate(0, bev - h/2, 0);
  g.computeVertexNormals();
  return g;
}

/* Keycap: lofted rounded-rect rings with a taper, a soft top bevel and a
   spherical dish. One geometry per width so corner radii never stretch. */
const CAP = {gap:0.12, unit:0.86, dish:0.024, taper:0.12, H:0.5};
const capGeoCache = {};
function capGeometry(units){
  const key = units.toFixed(2);
  if (capGeoCache[key]) return capGeoCache[key];
  const H = CAP.H, W = CAP.unit + (units - 1), D = CAP.unit, t = CAP.taper, seg = 4;
  const rings = [
    [0,        W,             D,             0.07 ],
    [0.05,     W,             D,             0.07 ],
    [H*0.80,   W - 2*t*0.82,  D - 2*t*0.82,  0.095],
    [H*0.965,  W - 2*t,       D - 2*t,       0.10 ],
    [H,        W - 2*t - 0.045, D - 2*t - 0.045, 0.08]
  ];
  const pos = []; let n = 0;
  for (const [y,w,d,r] of rings){ const p = rrect(w,d,r,seg); n = p.length/2; for (let j = 0; j < n; j++) pos.push(p[j*2], y, p[j*2+1]); }
  const top = rings[rings.length - 1];
  const inner = rrect(top[1]*0.55, top[2]*0.55, top[3]*0.55, seg);
  for (let j = 0; j < n; j++) pos.push(inner[j*2], H - CAP.dish*0.62, inner[j*2+1]);
  pos.push(0, H - CAP.dish, 0);
  const idx = [], ringCount = rings.length + 1;
  for (let i = 0; i < ringCount - 1; i++) for (let j = 0; j < n; j++){
    const a = i*n + j, b = i*n + (j+1)%n, c = (i+1)*n + j, d = (i+1)*n + (j+1)%n;
    idx.push(a,c,d, a,d,b);
  }
  const ib = (ringCount - 1)*n, center = ringCount*n;
  for (let j = 0; j < n; j++) idx.push(ib + j, center, ib + (j+1)%n);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx); g.computeVertexNormals(); g.computeBoundingSphere();
  capGeoCache[key] = g;
  return g;
}

/* Collapse a group of static meshes into one mesh per material. */
function mergeByMaterial(root){
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  const buckets = new Map(), m = new THREE.Matrix4(), nm = new THREE.Matrix3(), v = new V3(), nn = new V3();
  root.traverse(o => {
    if (!o.isMesh || !o.geometry) return;
    const g = o.geometry, P = g.attributes.position, N = g.attributes.normal;
    m.multiplyMatrices(inv, o.matrixWorld); nm.getNormalMatrix(m);
    let b = buckets.get(o.material);
    if (!b){ b = {pos:[], nor:[], idx:[], n:0, cast:false}; buckets.set(o.material, b); }
    b.cast = b.cast || o.castShadow;
    for (let i = 0; i < P.count; i++){
      v.fromBufferAttribute(P, i).applyMatrix4(m); b.pos.push(v.x, v.y, v.z);
      nn.fromBufferAttribute(N, i).applyMatrix3(nm).normalize(); b.nor.push(nn.x, nn.y, nn.z);
    }
    if (g.index){ for (let i = 0; i < g.index.count; i++) b.idx.push(g.index.getX(i) + b.n); }
    else { for (let i = 0; i < P.count; i++) b.idx.push(i + b.n); }
    b.n += P.count;
  });
  const out = new THREE.Group();
  for (const [mat, b] of buckets){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(b.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(b.nor, 3));
    g.setIndex(b.idx); g.computeBoundingSphere();
    const mesh = new THREE.Mesh(g, mat); mesh.castShadow = b.cast; mesh.receiveShadow = true;
    out.add(mesh);
  }
  return out;
}

/* five-storey pagoda, normalised to about one unit tall */
function kPagoda(m, bells){
  const g = new THREE.Group();
  const pod = mb(0.62, 0.05, 0.62, m.stone); pod.position.y = 0.025; g.add(pod);
  let y = 0.05;
  for (let i = 0; i < 5; i++){
    const f = 1 - i*0.085, bw = 0.3*f, bh = i === 0 ? 0.095 : 0.07, ex = 0.31*f;
    const body = mb(bw, bh, bw, m.vermilion); body.position.y = y + bh/2; g.add(body);
    const band = mb(bw*1.03, 0.014, bw*1.03, m.trim); band.position.y = y + bh - 0.01; g.add(band);
    y += bh;
    const eave = mb(ex*2, 0.012, ex*2, m.tileD); eave.position.y = y + 0.006; g.add(eave);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(ex*Math.SQRT2*0.96, 0.07, 4, 1), m.tile);
    roof.rotation.y = Math.PI/4; roof.position.y = y + 0.047; roof.castShadow = true; g.add(roof);
    for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]){
      const tip = mb(0.06*f, 0.011, 0.016, m.tileD);
      tip.position.set(sx*(ex - 0.015), y + 0.02, sz*(ex - 0.015));
      tip.rotation.set(0, Math.atan2(-sz, sx), 0.38);
      g.add(tip);
      if (bells && i === 0){
        const b = new THREE.Group(); b.position.set(sx*(ex + 0.004), y + 0.004, sz*(ex + 0.004));
        const chain = mc(0.0018, 0.0018, 0.022, 4, m.bronze); chain.position.y = -0.011; b.add(chain);
        const bell = mcone(0.0085, 0.016, 8, m.bronze); bell.position.y = -0.028; b.add(bell);
        bells.push(b); g.add(b);
      }
    }
    y += 0.05;
  }
  const spire = mc(0.008, 0.012, 0.22, 8, m.bronze); spire.position.y = y + 0.11; g.add(spire);
  for (let k = 0; k < 9; k++){ const ring = mtor(0.022 - k*0.0012, 0.004, 12, m.bronze); ring.rotation.x = Math.PI/2; ring.position.y = y + 0.05 + k*0.016; g.add(ring); }
  const jewel = msph(0.014, 8, m.bronze); jewel.position.y = y + 0.235; g.add(jewel);
  return g;
}

/* a maple: trunk, a few limbs, and a crown of autumn clusters */
function kMaple(m, h, n, spread, lean){
  const g = new THREE.Group(), mix = MAPLE_MIX(m);
  const trunk = mc(h*0.025, h*0.04, h*0.55, 7, m.woodD); trunk.position.y = h*0.275; trunk.rotation.z = (lean || 0)*0.3; g.add(trunk);
  for (let i = 0; i < 3; i++){
    const limb = mc(h*0.012, h*0.018, h*0.35, 5, m.woodD), a = i*2.1 + R();
    limb.position.set(Math.cos(a)*h*0.08, h*0.58, Math.sin(a)*h*0.08); limb.rotation.set(Math.sin(a)*0.7, 0, -Math.cos(a)*0.7); g.add(limb);
  }
  for (let i = 0; i < n; i++){
    const a = R()*Math.PI*2, rad = Math.pow(R(), 0.6)*spread*h, s = h*(0.07 + R()*0.09);

  return g;
}

    river.geometry.rotateX(-Math.PI/2); river.position.set(0, -62.05, -430); scene.add(river);

  })();

  /* western mountains, layered into the haze */

    const s = new THREE.Shape(), N = 90, base = -63;
    s.moveTo(x0, base - 4);

      pagodaMat.emissiveIntensity = lampOn*0.32;

}

  const planks = (function(){
    const c = makeCanvas(1024, 1024), x = c.getContext('2d'), bw = 1024/40;
    for (let i = 0; i < 40; i++){
      const tone = 150 + ((hash2(i, 3)*40)|0);

      x.globalAlpha = 1; x.fillStyle = 'rgba(30,18,10,0.55)'; x.fillRect(i*bw, 0, 2, 1024);
      const joint = rr(0, 1024); x.fillRect(i*bw, joint, bw, 2);

    t.anisotropy = 8; return t;

  const deckMat = new THREE.MeshStandardMaterial({color:0xffffff, map:planks, roughness:0.72});

  const kH = KYO.kH || ((x, z) => -17);

  (function stilts(){

    for (let x = -18.4; x <= 18.41; x += 3.68) pts.push([x, -10.2], [x, -5.6]);

    const pil = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.42, 0.46, 1, 10), m.woodM, pts.length);
    const d = new THREE.Object3D();
    pts.forEach(([x, z], i) => {
      const bot = kH(x, z) - 1, top = -0.5, h = top - bot;
      d.position.set(x, bot + h/2, z); d.scale.set(1, h, 1); d.rotation.set(0, 0, 0); d.updateMatrix(); pil.setMatrixAt(i, d.matrix);
    });
    pil.castShadow = true; pil.receiveShadow = true; scene.add(pil);
    const beams = new THREE.Group();
    for (const y of [-4.2, -9.4, -14.4]){
      for (const z of [-10.2, -5.6]){ const b = mb(37.6, 0.42, 0.3, m.woodD); b.position.set(0, y, z); beams.add(b); }
      for (const x of [-18.6, 18.6]){ const b = mb(0.3, 0.42, 25, m.woodD); b.position.set(x, y, 2); beams.add(b); }
    }
    scene.add(mergeByMaterial(beams));
  })();

  /* railing on three sides, bronze giboshi caps on the corners */
  (function railing(){
    const g = new THREE.Group(), H = 1.05;
    const run = (x0, z0, x1, z1) => {
      const len = Math.hypot(x1 - x0, z1 - z0), n = Math.max(2, Math.round(len/2.1)), ang = Math.atan2(z1 - z0, x1 - x0);
      for (let i = 0; i <= n; i++){
        const t = i/n, p = mb(0.17, H, 0.17, m.woodM); p.position.set(lerp(x0, x1, t), H/2, lerp(z0, z1, t)); g.add(p);
      }
      for (const [y, th] of [[H - 0.05, 0.12], [0.55, 0.07], [0.12, 0.09]]){
        const r = mb(len, th, th, m.woodD); r.position.set((x0 + x1)/2, y, (z0 + z1)/2); r.rotation.y = -ang; g.add(r);
      }
    };
    run(-18.9, -10.15, 18.9, -10.15); run(-18.9, -10.15, -18.9, 14.3); run(18.9, -10.15, 18.9, 14.3);
    for (const [x, z] of [[-18.9, -10.15], [18.9, -10.15], [-18.9, 14.3], [18.9, 14.3]]){
      const cap = msph(0.15, 10, m.bronze); cap.position.set(x, H + 0.1, z); g.add(cap);
      const tip = mcone(0.07, 0.16, 8, m.bronze); tip.position.set(x, H + 0.3, z); g.add(tip);
    }
    scene.add(mergeByMaterial(g));
  })();

  /* a beam of paper lanterns along the back of the stage */
  const lanterns = [];
  (function(){
    const g = new THREE.Group(), H = 5.6, X = 16.6, Z = -9.55;
    for (const sx of [-1, 1]){ const p = mb(0.26, H, 0.26, m.woodD); p.position.set(sx*X, H/2, Z); g.add(p); }
    const beam = mb(2*X + 0.6, 0.24, 0.26, m.woodD); beam.position.set(0, H - 0.25, Z); g.add(beam);
    scene.add(mergeByMaterial(g));
    for (let i = 0; i < 9; i++){
      const L = new THREE.Group(); L.position.set(lerp(-14.4, 14.4, i/8), H - 0.38, Z);
      const cord = mc(0.012, 0.012, 0.34, 4, m.dark); cord.position.y = -0.17; L.add(cord);
      const body = msph(0.33, 18, i % 2 ? m.lanternC : m.lanternR); body.scale.y = 1.28; body.position.y = -0.34 - 0.42; L.add(body);
      for (const s of [1, -1]){ const cap = mc(0.2, 0.2, 0.07, 14, m.dark); cap.position.y = -0.76 + s*0.43; L.add(cap); }
      scene.add(L); lanterns.push({g:L, ph:i*0.7 + R()});
    }
  })();

  /* a great stone lantern and an old maple at the corners */
  const big = kToro(m, m.toro); big.scale.setScalar(2.6); big.position.set(-15.6, 0, -7.4); scene.add(mergedAt(big));
  const maple = kMaple(m, 6.6, 150, 0.55, -0.4); maple.position.set(15.4, 0, -8.6); scene.add(mergedAt(maple));

  /* desk mat: indigo felt, stitched */
  const feltBump = tileNoise(256, 32, 0.9); feltBump.repeat.set(0.9, 0.9);
  const felt = std(SET.board.mat, 0.98, 0, {bumpMap:feltBump, bumpScale:0.02});
  const mat = new THREE.Mesh(chamferBox(24.5, 0.06, 11.4, 0.6, 0.025), felt);
  mat.position.set(0, 0.03, 0.4); mat.receiveShadow = true; scene.add(mat);
  const stitch = new THREE.Mesh(chamferBox(24.1, 0.004, 11.0, 0.45, 0.001), std(SET.board.stitch, 0.9));
  stitch.position.set(0, 0.062, 0.4); scene.add(stitch);
  const inner = new THREE.Mesh(chamferBox(23.9, 0.006, 10.8, 0.4, 0.001), felt);
  inner.position.set(0, 0.063, 0.4); scene.add(inner);

  /* maple leaves drifting down past the stage and settling on its front */
  const leaves = (function(){
    const s = new THREE.Shape(), N = 10;
    for (let i = 0; i <= N; i++){
      const a = Math.PI/2 + i/N*Math.PI*2, r = i % 2 ? 0.42 : 1;
      const px = Math.cos(a)*r*0.17, py = Math.sin(a)*r*0.17;
      i ? s.lineTo(px, py) : s.moveTo(px, py);
    }
    const geo = new THREE.ShapeGeometry(s); geo.rotateX(-Math.PI/2);
    const cnt = MOBILE ? 40 : 64, mesh = new THREE.InstancedMesh(geo, std('#FFFFFF', 0.7, 0, {side:THREE.DoubleSide}), cnt);
    mesh.frustumCulled = false; mesh.castShadow = true;
    const tones = ['#B32E25','#C9442A','#D1602A','#D49A33','#A62A2A'].map(col), L = [];
    for (let i = 0; i < cnt; i++){
      const lf = {front: i % 5 < 2, ph:R()*10, spin:rr(0.6, 1.8)*(R() < 0.5 ? -1 : 1), fall:rr(0.35, 0.7), drift:rr(0.15, 0.5), rest:0, shrink:1, s:rr(0.8, 1.25)};
      spawn(lf, true); L.push(lf); mesh.setColorAt(i, tones[(R()*tones.length)|0]);
    }
    function spawn(lf, any){
      if (lf.front){ lf.x = rr(-17, 17); lf.z = rr(6.6, 13.6); lf.y = any ? rr(0.5, 9) : rr(7, 10); }
      else { lf.x = rr(-24, 24); lf.z = rr(-30, -9.5); lf.y = any ? rr(-14, 12) : rr(8, 13); }
      lf.rest = 0; lf.shrink = 1;
    }
    const d = new THREE.Object3D();
    function step(dt){
      L.forEach((lf, i) => {
        if (lf.rest > 0){
          lf.rest -= dt; if (lf.rest < 0.6) lf.shrink = Math.max(0, lf.rest/0.6);
          if (lf.rest <= 0) spawn(lf, false);
          d.position.set(lf.x, 0.035, lf.z); d.rotation.set(0, lf.ph, 0);
        } else {
          lf.y -= lf.fall*dt; lf.x += (lf.drift + Math.sin(T*1.3 + lf.ph)*0.5)*dt; lf.z += Math.cos(T*0.9 + lf.ph)*0.25*dt;
          if (lf.front && lf.y <= 0.035){ lf.y = 0.035; lf.rest = rr(3, 7); }
          if (!lf.front && lf.y < -20) spawn(lf, false);
          d.position.set(lf.x, lf.y, lf.z);
          d.rotation.set(Math.sin(T*1.7 + lf.ph)*1.1, T*lf.spin + lf.ph, Math.cos(T*1.3 + lf.ph)*0.6);
        }
        d.scale.setScalar(lf.s*lf.shrink); d.updateMatrix(); mesh.setMatrixAt(i, d.matrix);
      });
      mesh.instanceMatrix.needsUpdate = true;
    }
    scene.add(mesh);
    return {step};
  })();

  return {
    slab:deckMesh, mat, warmPos:new V3(0, 4.3, -7.2),
    applyTOD(){
      m.lanternR.emissiveIntensity = lampOn*1.7; m.lanternC.emissiveIntensity = lampOn*1.5; m.toro.emissiveIntensity = lampOn*2.2;
    },
    animate(dt){
      for (const L of lanterns) L.g.rotation.z = Math.sin(T*0.9 + L.ph)*0.035;
      leaves.step(dt);
    }
  };
}

/* ── the lane inside the board ──────────────────────────── */
function streetKyoto(){
  const m = kyotoMats();
  const villageStatic = new THREE.Group();
  /* a gabled roof: two pitched planes, a ridge, and the gable ends filled */
  function gable(g, w, d, y, mat, wallMat){
    const a = 0.46, half = d/2 + 0.035, slope = half/Math.cos(a);
    for (const s of [1, -1]){
      const pl = mb(w + 0.06, 0.016, slope, mat);
      pl.position.set(0, y + Math.tan(a)*half/2 - 0.004, s*half/2); pl.rotation.x = s*a; g.add(pl);
    }
    const ridge = mb(w + 0.07, 0.022, 0.026, m.tileD); ridge.position.y = y + Math.tan(a)*half; g.add(ridge);
    const tri = new THREE.Shape(); tri.moveTo(-d/2, 0); tri.lineTo(d/2, 0); tri.lineTo(0, Math.tan(a)*d/2); tri.lineTo(-d/2, 0);
    const tg = new THREE.ExtrudeGeometry(tri, {depth:w - 0.004, bevelEnabled:false}); tg.rotateY(Math.PI/2); tg.translate(-(w - 0.004)/2, 0, 0);
    const fill = new THREE.Mesh(tg, wallMat); fill.position.y = y; fill.castShadow = true; fill.receiveShadow = true; g.add(fill);
  }
  /* a machiya townhouse: dark lattice below, plaster above, tiled roofs */
  function machiya(w, d, h, o){
    const g = new THREE.Group(), h1 = Math.min(h, 0.25), two = h > 0.34;
    const low = mb(w, h1, d, m.woodD); low.position.y = h1/2; g.add(low);
    const front = d/2 + 0.004;
    const pane = mb(w*0.58, h1*0.56, 0.006, m.shoji); pane.position.set(w*0.12, h1*0.48, front); g.add(pane);
    for (let sx = w*0.12 - w*0.29 + 0.012; sx < w*0.12 + w*0.29; sx += 0.021){ const sl = mb(0.006, h1*0.6, 0.008, m.woodM); sl.position.set(sx, h1*0.48, front + 0.004); g.add(sl); }
    const door = mb(0.075, 0.14, 0.008, m.dark); door.position.set(-w/2 + 0.07, 0.07, front); g.add(door);
    const nr = mb(0.085, 0.05, 0.004, o.red ? m.norenR : m.noren); nr.position.set(-w/2 + 0.07, 0.115, front + 0.008); g.add(nr);
    const hisashi = mb(w + 0.02, 0.012, 0.075, m.tile); hisashi.position.set(0, h1 + 0.008, front + 0.03); hisashi.rotation.x = 0.36; g.add(hisashi);
    if (o.inuyarai){
      const iy = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, w*0.6, 10, 1, true, 0, Math.PI/2), m.bamboo);
      iy.material.side = THREE.DoubleSide; iy.rotation.z = Math.PI/2; iy.position.set(w*0.12, 0, front); g.add(iy);
    }
    let top = h1;
    if (two){
      const h2 = h - h1, up = mb(w*0.97, h2, d*0.88, m.plaster); up.position.set(0, h1 + h2/2, -d*0.04); g.add(up);
      const win = mb(w*0.44, h2*0.36, 0.006, m.shoji); win.position.set(0, h1 + h2*0.52, d*0.4 + 0.004); g.add(win);
      for (let sx = -w*0.2; sx <= w*0.2; sx += 0.02){ const sl = mb(0.008, h2*0.38, 0.008, m.woodD); sl.position.set(sx, h1 + h2*0.52, d*0.4 + 0.008); g.add(sl); }
      top = h;
      gable(g, w*0.97, d*0.88, top, m.tile, m.plaster);
    } else gable(g, w, d, top, m.tile, m.woodD);
    if (o.lantern){
      const lt = msph(0.02, 10, m.lanternR); lt.scale.y = 1.3; lt.position.set(-w/2 + 0.14, h1*0.82, front + 0.03); g.add(lt);
    }
    return g;
  }
  function teaStand(){
    const g = new THREE.Group();
    const top = mb(0.15, 0.012, 0.055, m.felt); top.position.y = 0.05; g.add(top);
    for (const sx of [-1, 1]) for (const sz of [-1, 1]){ const l = mb(0.008, 0.045, 0.008, m.woodD); l.position.set(sx*0.065, 0.022, sz*0.022); g.add(l); }
    const pole = mc(0.004, 0.004, 0.29, 6, m.bamboo); pole.position.set(0.05, 0.145, -0.04); g.add(pole);
    const um = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.055, 18, 1, true), m.umbrella); um.position.set(0.05, 0.3, -0.04); um.castShadow = true; g.add(um);
    return g;
  }
  function bamboo(){
    const g = new THREE.Group();
    for (let i = 0; i < 6; i++){ const h = rr(0.32, 0.5), c = mc(0.006, 0.007, h, 6, m.bambooG); c.position.set(rr(-0.04, 0.04), h/2, rr(-0.04, 0.04)); c.rotation.z = rr(-0.08, 0.08); g.add(c); }
    return g;
  }
  for (let r = 0; r < 6; r++){
    const v = VOID[r], x0 = LX(v.L), x1 = LX(v.R), z0 = STRIP[r], z1 = STRIP[r+1], h = LIFT[r];
    const g = mb(x1 - x0, h, z1 - z0, m.ground); g.position.set((x0 + x1)/2, PLATE_TOP + h/2, (z0 + z1)/2); g.castShadow = false; villageStatic.add(g);
    if (r < 5){ const lx = laneXAt(STRIP[r+1]), nose = mb(1.0, 0.014, 0.05, m.step); nose.position.set(lx, groundTop(r) + 0.007, STRIP[r+1] - 0.025); villageStatic.add(nose); }
  }
  function building(r, side, cx, zc, len, dep){
    const gy = groundTop(r), rowF = (5 - r)/5, h = rr(lerp(0.27, 0.36, rowF), lerp(0.4, 0.52, rowF));
    const hs = machiya(len, dep, h, {red:R() < 0.3, inuyarai:R() < 0.45, lantern:R() < 0.5});
    hs.position.set(cx, gy, zc); hs.rotation.y = side < 0 ? Math.PI/2 : -Math.PI/2; villageStatic.add(hs);
  }
  function inner(r, side, cx, zc, len, w){
    const gy = groundTop(r), roll = R();
    if (r >= 2 && roll < 0.42){
      const t = teaStand(); t.position.set(cx, gy, zc); t.rotation.y = side < 0 ? Math.PI/2 : -Math.PI/2; villageStatic.add(t);
      CAFES.push({x:cx, y:gy, z:zc, bench:true, side});
    } else if (roll < 0.72){
      const mp = kMaple(m, rr(0.42, 0.62), 9, 0.32, 0); mp.position.set(cx, gy, zc); villageStatic.add(mp);
    } else if (roll < 0.86){
      const t = kToro(m, m.toro); t.scale.setScalar(rr(0.17, 0.22)); t.position.set(cx, gy, zc); villageStatic.add(t);
    } else { const b = bamboo(); b.position.set(cx, gy, zc); villageStatic.add(b); }
  }
  function fillBand(r, side, xWall, edgeOverride){
    const z0 = STRIP[r] + 0.05, z1 = STRIP[r+1] - 0.05;
    let z = z0;
    while (z < z1 - 0.22){
      const len = Math.min(rr(0.36, 0.5), z1 - z), zc = z + len/2;
      const edge = edgeOverride !== undefined ? edgeOverride : laneXAt(zc) + side*0.5;
      const bw = side < 0 ? edge - xWall : xWall - edge;
      if (bw > 0.22){
        const dep = Math.min(bw, rr(0.36, 0.58));

function wedgeGeometry(){
  const {W, D, hf, hb, b} = CASE, d = D - 2*b, f = hf - 2*b, k = hb - 2*b, r = 0.22;
  const zf = d/2, zb = -d/2, sl = (k - f)/d, yAt = z => f + (zf - z)*sl;

  s.lineTo(zf, f - r); s.quadraticCurveTo(zf, f, zf - r, yAt(zf - r));
  s.lineTo(zb + r, yAt(zb + r)); s.quadraticCurveTo(zb, k, zb, k - r);
  s.lineTo(zb, r); s.quadraticCurveTo(zb, 0, zb + r, 0);

}

    br.rotation.z = Math.PI/2; br.scale.x = 0.55; br.position.y = h; br.castShadow = br.receiveShadow = true; g.add(br);

    const par = mb(w + 0.016, 0.022, d + 0.016, MAT.wall); par.position.y = h + 0.011; g.add(par);

  const door = mb(0.064, 0.12, 0.01, MAT.door); door.position.set(-w*0.22, 0.06, d/2 + 0.005); g.add(door);

    const pane = mb(0.054, 0.064, 0.008, MAT.win); pane.position.set(wx, h*0.58, d/2 + 0.004); g.add(pane);
    for (const s of [-1, 1]){ const sh = mb(0.024, 0.068, 0.006, MAT.shutter); sh.position.set(wx + s*0.04, h*0.58, d/2 + 0.006); g.add(sh); }

const villageStatic = new THREE.Group();
(function buildVillage(){
  for (let r = 0; r < 6; r++){
    const v = VOID[r], x0 = LX(v.L), x1 = LX(v.R), z0 = STRIP[r], z1 = STRIP[r+1], h = LIFT[r];
    const m = mb(x1 - x0, h, z1 - z0, MAT.ground); m.position.set((x0 + x1)/2, PLATE_TOP + h/2, (z0 + z1)/2); m.castShadow = false;

      const nose = mb(1.0, 0.012, 0.045, MAT.step); nose.position.set(lx, groundTop(r) + 0.006, zx - 0.0225); villageStatic.add(nose);
    }
  }
  function building(r, side, cx, zc, len, dep){
    const gy = groundTop(r), rowF = (5 - r)/5, hmin = lerp(0.3, 0.44, rowF), h = rr(hmin, hmin + 0.24);
    const o = {dome:R() < 0.18, stack:R() < 0.38, sx:R() < 0.5 ? -1 : 1, stairs:R() < 0.22, bloom:R() < 0.3,
      windows:1 + ((R()*2)|0), alt:R() < 0.3};
    if (o.dome) o.stack = false;
    if (!o.dome && !o.stack) o.barrel = R() < 0.3;
    const hs = vHouse(len, dep, h, o);
    hs.position.set(cx, gy, zc); hs.rotation.y = side < 0 ? Math.PI/2 : -Math.PI/2;
    villageStatic.add(hs);
  }
  function inner(r, side, cx, zc, len, w){
    const gy = groundTop(r), roll = R();
    if (r >= 3 && roll < 0.5){
      const c = vCafe(R() < 0.33 ? MAT.canvasW : (R() < 0.5 ? MAT.canvasB : MAT.canvasT));
      c.position.set(cx, gy, zc); c.rotation.y = R()*6; villageStatic.add(c);
      CAFES.push({x:cx, y:gy, z:zc});
    } else if (roll < 0.7){
      const hs = vHouse(len*0.9, Math.max(0.16, w*0.9), rr(0.16, 0.24), {windows:1, bloom:R() < 0.4});
      hs.position.set(cx, gy, zc); hs.rotation.y = side < 0 ? Math.PI/2 : -Math.PI/2; villageStatic.add(hs);
    } else if (roll < 0.86){
      const c = vCypress(rr(0.34, 0.5)); c.position.set(cx, gy, zc); villageStatic.add(c);
    } else {
      const p = vPlanter(); p.position.set(cx, gy, zc); villageStatic.add(p);
    }
  }
  function fillBand(r, side, xWall, edgeOverride){
    const z0 = STRIP[r] + 0.05, z1 = STRIP[r+1] - 0.05;
    let z = z0;
    while (z < z1 - 0.22){
      const len = Math.min(rr(0.34, 0.5), z1 - z), zc = z + len/2;
      const edge = edgeOverride !== undefined ? edgeOverride : laneXAt(zc) + side*0.5;
      const bw = side < 0 ? edge - xWall : xWall - edge;
      if (bw > 0.22){
        const dep = Math.min(bw, rr(0.36, 0.6));
        building(r, side, side < 0 ? xWall + dep/2 : xWall - dep/2, zc, len, dep);
        const rem = bw - dep - 0.04;
        if (rem > 0.2) inner(r, side, side < 0 ? xWall + dep + 0.04 + rem/2 : xWall - dep - 0.04 - rem/2, zc, len, rem);
      }
      z += len + 0.03;
    }

    const v = VOID[r];
    fillBand(r, -1, LX(v.L) + 0.04);
    if (r === 0){

      const edge = laneXAt((STRIP[0] + STRIP[1])/2) + 0.5, xr = LX(v.R) - 0.04;
      const chapelDyn = new THREE.Group(); villageDyn.add(chapelDyn);

      villageStatic.add(ch);

      fillBand(0, 1, xr, edge + 0.8);
    } else fillBand(r, 1, LX(v.R) - 0.04);

const GRADE_VS = `

void main(){
  vUv = uv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const GRADE_FS = `

uniform float uTime;
uniform float uVig;
uniform float uGrain;
uniform float uCA;
uniform vec3 uTint;

varying vec2 vUv;
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

  vec2 c = vUv - 0.5;
  vec2 off = c * dot(c, c) * uCA;
  vec3 rgb;
  rgb.r = texture2D(tDiffuse, vUv + off).r;
  rgb.g = texture2D(tDiffuse, vUv).g;
  rgb.b = texture2D(tDiffuse, vUv - off).b;

  const RT = {format:THREE.RGBAFormat, stencilBuffer:true};

  if (gl2) rt.samples = 4;

   ════════════════════════════════════════════════════════════ */

}
buildIndex();
function openIndex(){ indexOpen = true; indexEl.classList.add('open'); indexEl.setAttribute('aria-hidden', 'false'); SFX.tick(0); hideTag(); const b = idxList.querySelector('button'); if (b) b.focus(); }
function closeIndex(silent){
  if (!indexOpen) return;
  indexOpen = false; indexEl.classList.remove('open'); indexEl.setAttribute('aria-hidden', 'true');
  if (!silent) try { cv.focus({preventScroll:true}); } catch (_){}
}
on($('idxBtn'), 'click', () => indexOpen ? closeIndex() : openIndex());
on($('idxClose'), 'click', () => closeIndex());
on(indexEl, 'click', e => { if (e.target === indexEl) closeIndex(); });

/* progress */
const dotsEl = $('dots');
dotsEl.innerHTML = '';
ORDER.forEach(id => { const i = document.createElement('i'); i.dataset.id = id; dotsEl.appendChild(i); });
function updateProgress(){
  dotsEl.querySelectorAll('i').forEach(el => {
    const on = visited.has(el.dataset.id), c = PRODUCTS[el.dataset.id].color;
    el.classList.toggle('on', on);
    el.style.background = on ? c : ''; el.style.boxShadow = on ? '0 0 10px ' + c : '';
  });
  $('ctr').textContent = ORDER.length ? visited.size + ' of ' + ORDER.length + ' opened' : '';
  idxList.querySelectorAll('li').forEach(li => li.classList.toggle('done', visited.has(li.dataset.id)));
}

/* cursor tag */
let pointerX = -9999, pointerY = -9999, pointerDirty = false;
function placeTag(){ tagEl.style.transform = 'translate3d(' + (pointerX + 16) + 'px,' + (pointerY - 46) + 'px,0)'; }
function showTag(k){
  const P = k.prod, sw = tagEl.querySelector('.sw');
  tagEl.querySelector('.nm').textContent = P.name; tagEl.querySelector('kbd').textContent = P.key;
  sw.style.background = P.color; sw.style.boxShadow = '0 0 10px ' + P.color;
  tagEl.classList.add('on'); placeTag();
}
function hideTag(){ tagEl.classList.remove('on'); }
function updateHover(){
  if (!started || drag.active || COARSE || indexOpen) return;
  if (!pointerDirty && angSpeed < 0.02 && !flight) return;
  pointerDirty = false;
  const k = keyFromHit(hitAt(pointerX, pointerY, hoverables)), prod = k && k.prod ? k : null;
  if (prod !== hoverKey){
    if (hoverKey){ hoverKey.hover = 0; activate(hoverKey); }
    hoverKey = prod;
    if (prod){ prod.hover = 1; activate(prod); SFX.tick(panOf(prod)); if (focused !== prod) showTag(prod); }
    else hideTag();
  }
  cv.classList.toggle('point', !!k);
  if (hoverKey && focused !== hoverKey) placeTag(); else if (hoverKey) hideTag();
}

/* time of day */
const todTrack = $('todTrack'), todKnob = $('todKnob'), todLabel = $('todLabel');
let lastDetent = -1;
const todName = t => t < 0.24 ? 'Afternoon' : t < 0.53 ? 'Golden hour' : t < 0.82 ? 'Blue hour' : 'Night';
function setTodGoal(v, silent){
  todGoal = clamp(v, 0, 1);
  todKnob.style.left = (todGoal*100) + '%'; todLabel.textContent = todName(todGoal);
  todTrack.setAttribute('aria-valuenow', String(Math.round(todGoal*100)));
  todTrack.setAttribute('aria-valuetext', todName(todGoal));
  const det = Math.round(todGoal*24);
  if (det !== lastDetent){ if (lastDetent >= 0 && !silent) SFX.dial(); lastDetent = det; }
}
function setTodFromX(x){ const r = todTrack.getBoundingClientRect(); if (r.width > 0) setTodGoal((x - r.left)/r.width); }
on(todTrack, 'pointerdown', e => {
  todDrag = true; todIntro = null; todTrack.classList.add('drag');
  try { todTrack.setPointerCapture(e.pointerId); } catch (_){}
  setTodFromX(e.clientX); e.stopPropagation();
});
on(todTrack, 'pointermove', e => { if (todDrag) setTodFromX(e.clientX); });
const endTod = () => { todDrag = false; todTrack.classList.remove('drag'); };
on(todTrack, 'pointerup', endTod); on(todTrack, 'pointercancel', endTod);
on(todTrack, 'keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    e.preventDefault(); e.stopPropagation(); todIntro = null;
    setTodGoal(todGoal + (e.key === 'ArrowRight' ? 0.04 : -0.04));
  }
});

/* sound toggle */
const sndBtn = $('sndBtn');
function syncSnd(){
  const on = SFX.isOn();
  $('sndWave').style.display = on ? '' : 'none'; $('sndX').style.display = on ? 'none' : '';
  sndBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  sndBtn.setAttribute('aria-label', on ? 'Turn sound off' : 'Turn sound on');
}
on(sndBtn, 'click', () => {
  if (!SFX.isReady()){ if (SFX.init()) SFX.setEnabled(true); }
  else SFX.setEnabled(!SFX.isOn());
  syncSnd();
});

/* ════════════════════════════════════════════════════════════
   INPUT
   ════════════════════════════════════════════════════════════ */
const touches = new Map();
let pinch = null;
const ROT = MOBILE ? 0.0062 : 0.0048;
on(cv, 'contextmenu', e => e.preventDefault());
on(cv, 'pointerdown', e => {
  if (!started) return;
  idleT = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (_){}
  touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (touches.size === 2){
    const [a, b] = [...touches.values()];
    pinch = {d:Math.hypot(a.x - b.x, a.y - b.y), cx:(a.x + b.x)/2, cy:(a.y + b.y)/2};
    drag.active = false; releasePressed(true); return;
  }
  if (touches.size > 2) return;
  drag.active = true; drag.mode = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
  drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = drag.t0 = performance.now();
  drag.moved = 0; drag.vx = drag.vy = 0; cam.vy = cam.vp = 0;
  pointerX = e.clientX; pointerY = e.clientY;
  cv.classList.add('grabbing');
  if (e.button === 0 && !introRunning){
    const k = keyFromHit(hitAt(e.clientX, e.clientY, hoverables));
    if (k){ pressed = k; keyDown(k); }
  }
});
on(cv, 'pointermove', e => {
  pointerX = e.clientX; pointerY = e.clientY; pointerDirty = true; idleT = 0;
  if (touches.has(e.pointerId)) touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && touches.size === 2){
    const [a, b] = [...touches.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x)/2, cy = (a.y + b.y)/2;
    if (!introRunning){ if (d > 10 && pinch.d > 10) zoomAt(cx, cy, pinch.d/d); panBy(cx - pinch.cx, cy - pinch.cy); if (flight) flight = null; }
    pinch.d = d; pinch.cx = cx; pinch.cy = cy; hideHint();
    return;
  }
  if (!drag.active) return;
  const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
  drag.lx = e.clientX; drag.ly = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.moved > 7 && pressed) releasePressed(false);
  if (introRunning || drag.moved < 4) return;
  if (flight) flight = null;
  hideHint();
  const now = performance.now(), dts = Math.max(1, now - drag.lt)/1000; drag.lt = now;
  if (drag.mode === 'pan'){ panBy(dx, dy); return; }
  const dYaw = -dx*ROT;
  let dPitch = dy*ROT*0.8;
  if ((cam.g.pitch < LIM.pmin && dPitch < 0) || (cam.g.pitch > LIM.pmax && dPitch > 0)) dPitch *= 0.25;
  cam.g.yaw += dYaw; cam.g.pitch += dPitch;
  drag.vx = lerp(drag.vx, dYaw/dts, 0.35); drag.vy = lerp(drag.vy, dPitch/dts, 0.35);
});
function endPointer(e){
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
  if (!drag.active){ if (touches.size === 0) cv.classList.remove('grabbing'); return; }
  if (touches.size > 0) return;
  drag.active = false; cv.classList.remove('grabbing');
  const now = performance.now(), downKey = pressed;
  if (e.type === 'pointerup' && drag.moved < 7 && now - drag.t0 < 500) handleClick(e.clientX, e.clientY, downKey);
  else if (now - drag.lt < 90 && drag.mode === 'orbit' && !introRunning){ cam.vy = clamp(drag.vx*0.6, -4.5, 4.5); cam.vp = clamp(drag.vy*0.6, -2, 2); }
  releasePressed(false);
}
on(cv, 'pointerup', endPointer);
on(cv, 'pointercancel', endPointer);
on(cv, 'pointerleave', () => { pointerX = pointerY = -9999; pointerDirty = true; });
function handleClick(x, y, downKey){
  if (introRunning) return;
  const k = downKey || keyFromHit(hitAt(x, y, hoverables));   // the key sinks on press, so trust the one pressed
  if (k && k.prod) open(k.id);
  else if (!k && focused) close();
}
on(cv, 'dblclick', e => {
  if (!started || introRunning || focused) return;
  if (!keyFromHit(hitAt(e.clientX, e.clientY, hoverables))) flyTo(homePose(), 1.4);
});
on(cv, 'wheel', e => {
  e.preventDefault();
  if (!started || introRunning) return;
  idleT = 0; hideHint();
  const dy = e.deltaY*(e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
  const f = e.ctrlKey ? Math.exp(clamp(dy, -60, 60)*0.012) : Math.exp(clamp(dy, -240, 240)*0.0016);
  if (flight) flight = null;
  zoomAt(e.clientX, e.clientY, f);
}, {passive:false});

const downCodes = new Set();
const NO_SCROLL = new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','PageUp','PageDown','Home','End','Backspace','Quote','Slash']);
on(window, 'keydown', e => {
  if (!started){ if (e.code === 'Enter' && introReady){ e.preventDefault(); enter(true); } return; }
  idleT = 0;
  const tgt = e.target;
  if (tgt && (tgt.tagName === 'INPUT' || tgt.tagName === 'TEXTAREA' || tgt.tagName === 'SELECT' || tgt.isContentEditable)){
    const kid = CODE_TO_ID[e.code], kk = kid ? KEY_BY_ID[kid] : null;
    if (kk && !kk.removed && !e.repeat && !downCodes.has(e.code)){ downCodes.add(e.code); keyDown(kk); }
    return;
  }
  if (indexOpen){ if (e.code === 'Escape') closeIndex(); return; }
  if (tgt && tgt !== cv && tgt !== document.body && (tgt.tagName === 'BUTTON' || tgt.tagName === 'A') && (e.code === 'Enter' || e.code === 'Space')) return;
  const id = CODE_TO_ID[e.code], k = id ? KEY_BY_ID[id] : null;
  if (k && !e.repeat && !downCodes.has(e.code)){ downCodes.add(e.code); keyDown(k); }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (NO_SCROLL.has(e.code)) e.preventDefault();
  if (e.repeat || introRunning) return;
  if (e.code === 'Escape'){ close(); return; }
  if (focused && e.code === 'ArrowRight'){ step(1); return; }
  if (focused && e.code === 'ArrowLeft'){ step(-1); return; }
  if (k && k.prod) open(k.id);
});
on(window, 'keyup', e => {
  downCodes.delete(e.code);
  const id = CODE_TO_ID[e.code], k = id ? KEY_BY_ID[id] : null;
  if (k) keyUp(k);
});
on(window, 'blur', () => { downCodes.clear(); for (const k of KEYS) if (k.down){ k.down = false; activate(k); } });
on(document, 'visibilitychange', () => SFX.visibility(document.hidden));

function onResize(){
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  const pr = renderer.getPixelRatio();
  if (composer){
    composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight);
    gradePass.uniforms.uRes.value.copy(renderer.getDrawingBufferSize(new THREE.Vector2()));
  }
  stars.material.uniforms.uPR.value = pr;
  GLOWS.forEach(p => { p.material.uniforms.uPR.value = pr; });
}
on(window, 'resize', onResize);

/* ════════════════════════════════════════════════════════════
   ENTRANCE
   ════════════════════════════════════════════════════════════ */
function enter(withSound){
  if (started || !introReady) return;
  started = true; introRunning = true;
  if (withSound && SFX.init()) SFX.setEnabled(true);
  syncSnd();
  $('intro').classList.add('gone'); document.body.classList.add('live');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  try { cv.focus({preventScroll:true}); } catch (_){}
  setPose(INTRO_POSE); applyCam();
  todIntro = {from:META.introFrom, to:META.tod, t:0};
  flyTo(homePose(), REDUCED ? 0.01 : 5.2, () => { introRunning = false; });
  SFX.swell();
  setTimeout(hideHint, 18000);
}
on($('goSound'), 'click', () => enter(true));
on($('goQuiet'), 'click', () => enter(false));

/* ════════════════════════════════════════════════════════════
   LIFE + LOOP
   ════════════════════════════════════════════════════════════ */
function animate(dt){
  stars.material.uniforms.uTime.value = T;
  for (const p of GLOWS) p.material.uniforms.uTime.value = T;
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  WORLD.animate(dt); PLAT.animate(dt); STREET.animate(dt);

  for (const s of SWAY){ s.ph = (s.ph || s.p) + dt*s.s*speedOf(s); s.o.rotation.z = s.base + Math.sin(s.ph)*s.a; }
  for (const s of SPIN) s.o.rotation.y += dt*s.spd*speedOf(s);
  for (const s of ORBIT){ s.ph += dt*s.spd*speedOf(s); s.o.rotation.y = s.ph; }

  bellPh += dt*5.5; bellAmp *= Math.exp(-0.45*dt);
  BELLS.forEach((b, i) => { b.rotation.z = Math.sin(bellPh + i*0.7)*(bellAmp + 0.02); });

  for (const L of LAMPS){
    let v = smooth(L.th, L.th + 0.035, tod);
    if (v > 0.02 && v < 0.98 && Math.sin(T*47 + L.th*311) < -0.2) v *= 0.25;
    L.mat.emissiveIntensity = v*3.0;
  }

  for (const k of productKeys){
    k.focus += ((focused === k ? 1 : 0) - k.focus)*(1 - Math.exp(-5*dt));
    k.glow  += ((k.hover ? 1 : 0) - k.glow)*(1 - Math.exp(-8*dt));
    k.baseMat.emissiveIntensity  = 0.22 + lampOn*1.05 + k.glow*0.7 + k.focus*1.3;
    k.shellMat.emissiveIntensity = 0.03 + lampOn*0.1 + k.glow*0.12 + k.focus*0.22;
  }

  for (const w of walkers){
    if (w.pause > 0) w.pause -= dt;
    else {
      w.t += w.spd*w.dir*dt;
      if (w.t > 0.985){ w.t = 0.985; w.dir = -1; w.pause = 1 + Math.random()*2.5; }
      if (w.t < 0.015){ w.t = 0.015; w.dir = 1; w.pause = 1 + Math.random()*2.5; }
      if (Math.random() < 0.0015) w.pause = 1.2 + Math.random()*3;
    }
    const p = lane.getPointAt(w.t), tg = lane.getTangentAt(w.t), gy = groundTop(rowAt(p.z));
    w.y += (gy - w.y)*(1 - Math.exp(-14*dt));
    w.g.position.set(p.x - tg.z*w.off, w.y, p.z + tg.x*w.off);
    w.g.rotation.y = Math.atan2(tg.x*w.dir, tg.z*w.dir);
    const st = w.pause > 0 ? 0 : Math.sin(T*9 + w.ph)*0.55;
    w.lL.rotation.x = st; w.lR.rotation.x = -st;
  }
  cat.t += dt*0.018; if (cat.t > 0.97) cat.t = 0.03;
  {
    const p = lane.getPointAt(cat.t), tg = lane.getTangentAt(cat.t);
    cat.y += (groundTop(rowAt(p.z)) - cat.y)*(1 - Math.exp(-14*dt));
    cat.g.position.set(p.x - tg.z*cat.off, cat.y, p.z + tg.x*cat.off);
    cat.g.rotation.y = Math.atan2(tg.x, tg.z) - Math.PI/2;
    cat.tail.rotation.z = 0.5 + Math.sin(T*3.1)*0.45;
  }

  for (const g of birds){
    const a = T*g.spd + g.ph;
    g.g.position.set(g.cx + Math.cos(a)*g.rad, g.y + Math.sin(a*2.1)*1.6, g.cz + Math.sin(a)*g.rad*0.7);
    g.g.rotation.y = -a + (g.spd > 0 ? Math.PI/2 : -Math.PI/2);
    const f = Math.sin(T*g.flap + g.ph)*0.55; g.l.rotation.z = f; g.r.rotation.z = -f;
  }
}

/* first paint */
applyTOD(tod);
updateEnv();
setPose(INTRO_POSE); applyCam();
setTodGoal(todGoal, true);
syncSnd(); updateProgress();
if (document.fonts && document.fonts.load){
  Promise.all([document.fonts.load('500 64px "Instrument Sans"'), document.fonts.load('500 38px "Instrument Sans"')])
    .then(drawAtlas).catch(() => {});
}
$('loadBar').style.transform = 'scaleX(0.6)';
function startPreview(){
  started = true; introRunning = false; todIntro = null;
  document.body.classList.add('live');
  setPose(homePose()); applyCam();
}
if (META.preview) startPreview();

const clock = new THREE.Clock();
let frames = 0, perfAcc = 0, perfN = 0;
renderer.setAnimationLoop(() => {
  const raw = clock.getDelta(), dt = Math.min(raw, 1/20);
  T += dt; idleT += dt; frames++;
  if (started) liveT += dt;
  if (todIntro){
    todIntro.t += dt/4.6;
    setTodGoal(lerp(todIntro.from, todIntro.to, easeInOut(Math.min(1, todIntro.t))), true);
    if (todIntro.t >= 1) todIntro = null;
  }
  tod += (todGoal - tod)*(1 - Math.exp(-(todDrag ? 10 : 4)*dt));
  if (Math.abs(tod - todShown) > 0.0004) applyTOD(tod);
  updateCamera(dt);
  updateHover();
  stepKeys(dt);
  animate(dt);
  envAge += dt;
  if (envDirty && envAge > (todDrag || todIntro ? 0.25 : 0.12)) updateEnv();
  SFX.update(dt, started ? angSpeed : 0, nightF, lampOn, tod);
  render(dt);
  if (frames === 2) cv.style.opacity = '';
  if (!introReady && frames >= 3){ introReady = true; $('loadBar').style.transform = 'scaleX(1)'; $('intro').classList.add('ready'); }
  if (liveT > 6 && qIdx < QUALITY.length - 1 && !RECORDING){   // a recording keeps full sharpness even if the recorder slows the frame rate
    perfAcc += raw;
    if (++perfN >= 120){
      const avg = perfAcc/perfN; perfAcc = 0; perfN = 0;
      if (avg > 0.024){ qIdx++; renderer.setPixelRatio(prFor(qIdx)); onResize(); }
    }
  }
});

/* ════════════════════════════════════════════════════════════
   TEARDOWN + STUDIO HANDLE
   ════════════════════════════════════════════════════════════ */
function dispose(){
  if (disposed) return;
  disposed = true;
  renderer.setAnimationLoop(null);
  for (const [t, ev, fn, o] of LISTENERS) t.removeEventListener(ev, fn, o);
  LISTENERS.length = 0;
  SFX.dispose();
  const seen = new Set();
  const drop = mt => {
    if (!mt || seen.has(mt)) return; seen.add(mt);
    for (const key in mt){ const v = mt[key]; if (v && v.isTexture) v.dispose(); }
    if (mt.uniforms) for (const key in mt.uniforms){ const v = mt.uniforms[key] && mt.uniforms[key].value; if (v && v.isTexture) v.dispose(); }
    mt.dispose();
  };
  scene.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(drop);
  });
  if (ATLAS.tex) ATLAS.tex.dispose();
  if (envRT) envRT.dispose();
  pmrem.dispose();
  if (composer){ composer.renderTarget1.dispose(); composer.renderTarget2.dispose(); }
  renderer.dispose();
  try { renderer.forceContextLoss(); } catch (_){}
  cv.remove();
  panel.classList.remove('open', 'show'); panel.setAttribute('aria-hidden', 'true');
  hideTag(); closeIndex(true);
  idxList.innerHTML = ''; dotsEl.innerHTML = '';
}
return {
  dispose,
  setting: META.street,
  setInsets(l, b, now){ INSET.l = l || 0; INSET.b = b || 0; if (focused) return; if (now){ setPose(homePose()); applyCam(); } else flyTo(homePose(), 0.6); },
  look(i){
    const k = KEY_BY_ID[ORDER[i]]; if (!k) return;
    if (focused) close();
    for (const pk of productKeys){ pk.hold = pk === k; activate(pk); }
    flyTo(lookPose(k), 1.1);
  },
  release(){ for (const pk of productKeys){ pk.hold = false; activate(pk); } },
  setTod(v){ todIntro = null; setTodGoal(v, true); },
  focus(i){ const id = ORDER[i]; if (id) open(id); },
  home(){ if (focused) close(); else flyTo(homePose(), 0.9); },
  sound(onOff){ if (onOff){ if (!SFX.isReady()) SFX.init(); SFX.setEnabled(true); } else SFX.setEnabled(false); syncSnd(); },
  update(products){
    for (const id of ORDER){
      const P = PRODUCTS[id], N = products[id];
      if (!N) continue;
      const recol = P.color !== N.color;
      Object.assign(P, N);
      if (recol) recolor(KEY_BY_ID[id]);
    }
    buildIndex(); updateProgress();
    if (focused) fillPanel(focused);
  }
};
}
window.Keystreet = {validate:validatePortfolio, boot, applyMeta, settings:SETTINGS_INFO, miniatures:MINIATURES,
  colors:FALLBACK_COLORS, usableKeys, keyLabels:KEY_LABELS, tods:TOD_NAMES, max:MAX_PROJECTS};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else setTimeout(start, 0);

\n\u003c/header>\n\n\u003cdiv class=\"hud act\" id=\"tools\">\n  \u003cdiv class=\"pill\" id=\"tod\" role=\"group\" aria-label=\"Time of day\">\n    \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003ccircle cx=\"12\" cy=\"12\" r=\"4\"/>\u003cpath d=\"M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4\"/>\u003c/svg>\n    \u003cdiv id=\"todTrack\" role=\"slider\" tabindex=\"0\" aria-label=\"Time of day\" aria-valuemin=\"0\" aria-valuemax=\"100\" aria-valuenow=\"64\">\u003cspan id=\"todKnob\">\u003c/span>\u003c/div>\n    \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M20 14.6A8.2 8.2 0 0 1 9.4 4 8.2 8.2 0 1 0 20 14.6z\"/>\u003c/svg>\n    \u003cspan id=\"todLabel\">Blue hour\u003c/span>\n  \u003c/div>\n  \u003cbutton class=\"pill ibtn\" id=\"sndBtn\" aria-label=\"Turn sound off\" aria-pressed=\"true\">\n    \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 9.5h3.5L12 5.5v13l-4.5-4H4z\"/>\u003cpath id=\"sndWave\" d=\"M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11\"/>\u003cpath id=\"sndX\" d=\"M16 9.5l5 5M21 9.5l-5 5\" style=\"display:none\"/>\u003c/svg>\n  \u003c/button>\n  \u003cbutton class=\"pill\" id=\"idxBtn\" aria-haspopup=\"dialog\">\n    \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M5 7h14M5 12h14M5 17h9\"/>\u003c/svg>\u003cspan class=\"lbl\">Index\u003c/span>\n  \u003c/button>\n\u003c/div>\n\n\u003cdiv class=\"hud\" id=\"progress\">\u003cdiv id=\"dots\" aria-hidden=\"true\">\u003c/div>\u003cspan id=\"ctr\">\u003c/span>\u003c/div>\n\u003cdiv class=\"hud\" id=\"hint\">Drag to look around, scroll to move in, click a glowing key. Or just type.\u003c/div>\n\n\u003caside id=\"panel\" aria-hidden=\"true\" aria-labelledby=\"pName\">\n  \u003cdiv class=\"halo\">\u003c/div>\n  \u003cdiv class=\"scroll\" id=\"pScroll\">\n    \u003cdiv class=\"top fx\">\u003ckbd id=\"pKey\">\u003c/kbd>\u003cspan id=\"pCat\">\u003c/span>\u003c/div>\n    \u003ch2 class=\"
