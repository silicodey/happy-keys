pt type=\"application/json\" id=\"portfolio\">\u003c/script>\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\">\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js\">\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js\">\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js\">\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js\">\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js\">\u003c/script>\n\u003cscript src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js\">\u003c/script>\n\u003cscript>\n(function(){\n'use strict';\n\n/* ════════════════════════════════════════════════════════════\n   ENVIRONMENT + SMALL UTILITIES\n   ════════════════════════════════════════════════════════════ */\nconst REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst COARSE  = matchMedia('(pointer: coarse)').matches;\nconst MOBILE  = COARSE || innerWidth \u003c= 820;\nconst HAS_POST = !!(THREE.EffectComposer && THREE.RenderPass && THREE.ShaderPass &&\n                    THREE.UnrealBloomPass && THREE.CopyShader && THREE.LuminosityHighPassShader);\nconst $ = id => document.getElementById(id);\nconst V3 = THREE.Vector3;\n\nconst clamp  = (v,a,b) => v \u003c a ? a : (v > b ? b : v);\nconst lerp   = (a,b,t) => a + (b - a) * t;\nconst smooth = (a,b,x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };\nconst easeInOut = t => t \u003c 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;\nfunction rng(seed){\n  return function(){\n    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;\n    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);\n    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n  };\n}\nconst R  = rng(80826);                 // deterministic: same village every visit\nconst rr = (a,b) => a + R() * (b - a);\nconst col = hex => new THREE.Color(hex).convertSRGBToLinear();\n\nfunction hash2(x,y){ const s = Math.sin(x*127.1 + y*311.7) * 43758.5453123; return s - Math.floor(s); }\nfunction vnoise(x,y,P){\n  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;\n  const u = xf*xf*(3 - 2*xf), v = yf*yf*(3 - 2*yf);\n  const h = (a,b) => { if (P){ a = ((a % P) + P) % P; b = ((b % P) + P) % P; } return hash2(a,b); };\n  return lerp(lerp(h(xi,yi), h(xi+1,yi), u), lerp(h(xi,yi+1), h(xi+1,yi+1), u), v) * 2 - 1;\n}\nfunction fbm(x,y,P){ let s = 0, a = 0.5, f = 1; for (let i = 0; i \u003c 4; i++){ s += a * vnoise(x*f, y*f, P ? P*f : 0); f *= 2; a *= 0.5; } return s; }\n\n/* ════════════════════════════════════════════════════════════\n   LAYOUT — a tenkeyless board. A lane runs through the middle:\n   any key that overlaps it was swallowed by the village.\n   [id, legend, x (units), width (units), kind: a = alpha, m = modifier]\n   ════════════════════════════════════════════════════════════ */\nconst LAYOUT = [\n  [['esc','esc',0,1,'m'],['F1','F1',2,1,'a'],['F2','F2',3,1,'a'],['F3','F3',4,1,'a'],['F4','F4',5,1,'a'],\n   ['F5','F5',6.5,1,'m'],['F6','F6',7.5,1,'m'],['F7','F7',8.5,1,'m'],['F8','F8',9.5,1,'m'],\n   ['F9','F9',11,1,'a'],['F10','F10',12,1,'a'],['F11','F11',13,1,'a'],['F12','F12',14,1,'a'],\n   ['prt','prt sc',15.25,1,'m'],['scr','scroll',16.25,1,'m'],['pau','pause',17.25,1,'m']],\n  [['~','~',0,1,'a'],['1','1',1,1,'a'],['2','2',2,1,'a'],['3','3',3,1,'a'],['4','4',4,1,'a'],['5','5',5,1,'a'],\n   ['6','6',6,1,'a'],['7','7',7,1,'a'],['8','8',8,1,'a'],['9','9',9,1,'a'],['0','0',10,1,'a'],['-','-',11,1,'a'],\n   ['=','=',12,1,'a'],['bksp','back',13,2,'m'],['ins','ins',15.25,1,'m'],['home','home',16.25,1,'m'],['pgup','pg up',17.25,1,'m']],\n  [['tab','tab',0,1.5,'m'],['Q','Q',1.5,1,'a'],['W','W',2.5,1,'a'],['E','E',3.5,1,'a'],['R','R',4.5,1,'a'],['T','T',5.5,1,'a'],\n   ['Y','Y',6.5,1,'a'],['U','U',7.5,1,'a'],['I','I',8.5,1,'a'],['O','O',9.5,1,'a'],['P','P',10.5,1,'a'],\n   ['[','[',11.5,1,'a'],[']',']',12.5,1,'a'],['\\\\','\\\\',13.5,1.5,'a'],\n   ['del','del',15.25,1,'m'],['end','end',16.25,1,'m'],['pgdn','pg dn',17.25,1,'m']],\n  [['caps','caps',0,1.75,'m'],['A','A',1.75,1,'a'],['S','S',2.75,1,'a'],['D','D',3.75,1,'a'],['F','F',4.75,1,'a'],\n   ['G','G',5.75,1,'a'],['H','H',6.75,1,'a'],['J','J',7.75,1,'a'],['K','K',8.75,1,'a'],['L','L',9.75,1,'a'],\n   [';',';',10.75,1,'a'],[\"'\",\"'\",11.75,1,'a'],['enter','enter',12.75,2.25,'m']],\n  [['shift','shift',0,2.25,'m'],['Z','Z',2.25,1,'a'],['X','X',3.25,1,'a'],['C','C',4.25,1,'a'],['V','V',5.25,1,'a'],\n   ['B','B',6.25,1,'a'],['N','N',7.25,1,'a'],['M','M',8.25,1,'a'],[',',',',9.25,1,'a'],['.','.',10.25,1,'a'],\n   ['/','/',11.25,1,'a'],['rshift','shift',12.25,2.75,'m'],['up','↑',16.25,1,'m']],\n  [['ctrl','ctrl',0,1.25,'m'],['win','cmd',1.25,1.25,'m'],['alt','alt',2.5,1.25,'m'],['space','',3.75,2.75,'a'],\n   ['altgr','alt',10,1.25,'m'],['fn','fn',11.25,1.25,'m'],['menu','menu',12.5,1.25,'m'],['rctrl','ctrl',13.75,1.25,'m'],\n   ['left','←',15.25,1,'m'],['down','↓',16.25,1,'m'],['right','→',17.25,1,'m']]\n];\nconst ROWZ   = [-3.1, -1.85, -0.85, 0.15, 1.15, 2.15];\nconst LANE_C = [8.1, 8.0, 8.0, 8.15, 7.95, 8.25];       // lane centre per row (layout units)\nconst LANE_HW = 1.45;\nconst LX = x => x - 9.125;\nconst LZ = z => z + 0.475;\nconst STRIP = [-3.6, -2.475, -1.35, -0.35, 0.65, 1.65, 2.65].map(LZ);\nconst ROW_H    = [0.56, 0.54, 0.50, 0.48, 0.50, 0.50];    // sculpted, cylindrical-profile row heights\nconst ROW_TILT = [0.15, 0.10, 0.04, 0.0, -0.05, -0.09];\nconst LIFT     = [0.29, 0.24, 0.19, 0.14, 0.09, 0.045];   // village terraces step up toward the back\n\nconst CODE_TO_ID = {Escape:'esc',Backquote:'~',Minus:'-',Equal:'=',Backspace:'bksp',Tab:'tab',BracketLeft:'[',BracketRight:']',\n  Backslash:'\\\\',IntlBackslash:'\\\\',CapsLock:'caps',Semicolon:';',Quote:\"'\",Enter:'enter',NumpadEnter:'enter',ShiftLeft:'shift',\n  ShiftRight:'rshift',Comma:',',Period:'.',Slash:'/',ControlLeft:'ctrl',MetaLeft:'win',OSLeft:'win',AltLeft:'alt',Space:'space',\n  AltRight:'altgr',MetaRight:'menu',OSRight:'menu',ContextMenu:'menu',ControlRight:'rctrl',ArrowUp:'up',ArrowDown:'down',\n  ArrowLeft:'left',ArrowRight:'right',Insert:'ins',Home:'home',PageUp:'pgup',Delete:'del',End:'end',PageDown:'pgdn',\n  PrintScreen:'prt',ScrollLock:'scr',Pause:'pau'};\nfor (let i = 0; i \u003c 10; i++) CODE_TO_ID['Digit' + i] = String(i);\nfor (let i = 1; i \u003c= 12; i++) CODE_TO_ID['F' + i] = 'F' + i;\nfor (const ch of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') CODE_TO_ID['Key' + ch] = ch;\n\n/* ════════════════════════════════════════════════════════════\n   PORTFOLIO LOADER — reads the portfolio, checks it, fills gaps,\n   and explains problems in plain words instead of a blank screen\n   ════════════════════════════════════════════════════════════ */\nconst MINIATURES = ['house','vault','forge','orbit','ledger','blueprint','palette','telescope','compass','loom','ship','sapling','gears','scales','lantern'];\nconst SETTINGS_INFO = {\n  santorini: {label:'Santorini', line:'a small street above the caldera', ready:true},\n  kyoto:     {label:'Kyoto', line:'a lantern-lit lane up to the pagoda', ready:true},\n  brooklyn:  {label:'Brooklyn', line:'a brownstone block above the river', ready:false},\n  lofoten:   {label:'Lofoten', line:'a harbour lane under the northern lights', ready:false}\n};\nconst TOD_NAMES = {afternoon:0.12, golden:0.42, 'golden hour':0.42, blue:0.64, 'blue hour':0.64, night:0.92};\nconst NUM_WORDS = ['No','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve'];\nconst FALLBACK_COLORS = ['#E5865A','#9A7DEB','#45A87C','#EAAE45','#6585EA','#33AACB','#DE5C94','#C9A23A','#5FB3A8','#D9705B','#7C93C9','#B7789E'];\nconst RESERVED_KEYS = new Set(['esc','left','right','up','down']);\nconst KEY_LABELS = {home:'Home', end:'End', ins:'Ins', del:'Del', pgup:'PgUp', pgdn:'PgDn', prt:'PrtSc', scr:'ScrLk', pau:'Pause'};\nconst FALLBACK_ORDER = 'ASDFLQWERTOPZXCV1234502'.split('').concat(['F1','F2','F3','F4','F9','F10','F11','F12','home','end','pgup','pgdn','ins','del']);\nconst MAX_PROJECTS = 12;\n\nconst esc = s => String(s == null ? '' : s).replace(/[&\u003c>\"']/g, c => ({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst isStr = v => typeof v === 'string' && v.trim().length > 0;\n\n/* which keys can hold a project: single-width, not swallowed by the street, not used for navigation */\nfunction usableKeys(){\n  const ok = new Map(), swallowed = new Set();\n  LAYOUT.forEach((row, r) => {\n    const c = LANE_C[r];\n    row.forEach(([id, label, x, w]) => {\n      if (x \u003c c + LANE_HW && x + w > c - LANE_HW){ swallowed.add(id.toLowerCase()); return; }\n      if (w === 1 && !RESERVED_KEYS.has(id)) ok.set(id.toLowerCase(), id);\n    });\n  });\n  return {ok, swallowed};\n}\n\n/* Checks a portfolio. In preview (the studio), nothing blocks the scene:\n   unusable fields fall back to defaults and each problem is reported\n   against the project and field it belongs to. */\nfunction validatePortfolio(raw, opts){\n  const preview = !!(opts && opts.preview);\n  const errors = [], fields = [];\n  const flag = (i, field, msg) => { fields.push({index:i, field, message:msg}); if (!preview) errors.push(msg); };\n  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {errors:['The portfolio must be a JSON object.'], fields};\n  const owner = raw.owner || {}, scene = raw.scene || {}, intro = raw.intro || {};\n  const ownerName = isStr(owner.name) ? owner.name.trim() : (preview ? 'Your name' : '');\n  if (!ownerName) errors.push('owner.name is missing. Every portfolio needs the name of the person or studio it belongs to.');\n  if ((scene.theme || 'keyboard') !== 'keyboard') errors.push('scene.theme \"' + scene.theme + '\" is not available yet. Available: keyboard.');\n  let street = String(scene.setting || scene.street || 'santorini').toLowerCase();\n  if (!SETTINGS_INFO[street] || !SETTINGS_INFO[street].ready){\n    const ok = Object.keys(SETTINGS_INFO).filter(k => SETTINGS_INFO[k].ready);\n    if (preview) street = 'santorini';\n    else errors.push('scene.setting \"' + street + '\" is not available yet. Available: ' + ok.join(', ') + '.');\n  }\n  let tod = 0.64;\n  if (scene.timeOfDay !== undefined){\n    const v = scene.timeOfDay;\n    if (typeof v === 'number' && v >= 0 && v \u003c= 1) tod = v;\n    else if (typeof v === 'string' && TOD_NAMES[v.toLowerCase()] !== undefined) tod = TOD_NAMES[v.toLowerCase()];\n    else if (!preview) errors.push('scene.timeOfDay should be a number from 0 to 1, or one of: afternoon, golden, blue, night.');\n  }\n\n  const list = Array.isArray(raw.projects) ? raw.projects : (preview ? [] : null);\n  if (!list) errors.push('projects is missing. It should be a list of the things you want on the board.');\n  else if (list.length === 0 && !preview) errors.push('projects is empty. Add at least one.');\n  else if (list.length > MAX_PROJECTS) errors.push('There are ' + list.length + ' projects. The keyboard holds up to ' + MAX_PROJECTS + '; pick your strongest.');\n  if (!list || (list.length === 0 && !preview) || list.length > MAX_PROJECTS) return {errors, fields};\n\n  const {ok, swallowed} = usableKeys(), taken = new Map(), items = [];\n  list.forEach((p, i) => {\n    const where = 'Project ' + (i + 1) + (isStr(p && p.name) ? ' (' + p.name + ')' : '');\n    if (!p || typeof p !== 'object'){ flag(i, 'name', where + ' is not an object.'); return; }\n    if (!isStr(p.name)){ flag(i, 'name', where + ' needs a name.'); return; }\n    const it = {p, key:null, i, url:null, color:null, arche:null};\n    if (p.name.length > 40) flag(i, 'name', where + ': the name is longer than 40 characters.');\n    if (isStr(p.url)){\n      if (/^https?:\\/\\/[^\\s]+\\.[^\\s]+/i.test(p.url.trim())) it.url = p.url.trim();\n      else flag(i, 'url', where + ': the link should be a full web address starting with https://');\n    }\n    if (p.color != null && p.color !== ''){\n      if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(p.color)) it.color = p.color;\n      else flag(i, 'color', where + ': color \"' + p.color + '\" should be a hex colour like #4C6FD1.');\n    }\n    if (p.miniature != null && p.miniature !== ''){\n      if (MINIATURES.indexOf(String(p.miniature).toLowerCase()) >= 0) it.arche = String(p.miniature).toLowerCase();\n      else flag(i, 'miniature', where + ': miniature \"' + p.miniature + '\" is not one of: ' + MINIATURES.join(', ') + '.');\n    }\n    if (p.key != null && p.key !== ''){\n      const k = String(p.key).toLowerCase();\n      if (swallowed.has(k)) flag(i, 'key', where + ': the ' + p.key + ' key sits where the street runs through the board. Choose another.');\n      else if (!ok.has(k)) flag(i, 'key', where + ': the ' + p.key + ' key cannot hold a project. Use a letter, a digit, an F-key, or Home, End, Ins, Del, PgUp, PgDn.');\n      else if (taken.has(k)) flag(i, 'key', where + ': the ' + p.key + ' key is already used by ' + taken.get(k) + '.');\n      else { it.key = ok.get(k); taken.set(k, p.name); }\n    }\n    items.push(it);\n  });\n  if (errors.length) return {errors, fields};\n\n  /* projects without a key get the first free letter of their own name, then sensible fallbacks */\n  for (const it of items){\n    if (it.key) continue;\n    const cands = it.p.name.toUpperCase().replace(/[^A-Z0-9]/g, '').split('').concat(FALLBACK_ORDER);\n    for (const c of cands){ const k = c.toLowerCase(); if (ok.has(k) && !taken.has(k)){ it.key = ok.get(k); taken.set(k, it.p.name); break; } }\n    if (!it.key){ errors.push('Ran out of keys for ' + it.p.name + '.'); return {errors, fields}; }\n  }\n\n  const products = {}, order = [], keyOf = {}, slotOf = {};\n  const txt = (v, max) => isStr(v) ? v.trim().slice(0, max) : '';\n  items.forEach(({p, key, i, url, color, arche}) => {\n    const body = Array.isArray(p.body) ? p.body.filter(isStr).map(s => s.trim().slice(0, 900)) : (isStr(p.body) ? [p.body.trim().slice(0, 900)] : []);\n    const facts = (Array.isArray(p.facts) ? p.facts : []).map(f => Array.isArray(f) ? f : (f && typeof f === 'object' ? [f.label, f.value] : null))\n      .filter(f => f && isStr(String(f[0] == null ? '' : f[0])) && f[1] != null && String(f[1]).trim()).slice(0, 6).map(f => [String(f[0]).slice(0, 40), String(f[1]).slice(0, 80)]);\n    const tags = (Array.isArray(p.tags) ? p.tags : []).filter(isStr).slice(0, 8).map(t => t.trim().slice(0, 30));\n    const label = KEY_LABELS[key] || key;\n    products[key] = {key:label, name:p.name.trim(), cat:txt(p.category, 60), color:color || FALLBACK_COLORS[i % FALLBACK_COLORS.length],\n      url, arche:arche || 'lantern', lede:txt(p.lede, 160), body, facts, tags};\n    slotOf[i] = order.length; order.push(key); keyOf[i] = label;\n  });\n  const n = order.length, word = NUM_WORDS[n] || String(n);\n  const meta = {\n    name:ownerName, subtitle:txt(owner.subtitle, 80), title:txt(owner.title, 80) || ownerName + ' | Portfolio',\n    description:txt(owner.description, 300) || ownerName + ' — an explorable keyboard portfolio.',\n    kicker:txt(intro.kicker, 60) || 'Portfolio',\n    line:txt(intro.line, 120) || word + ' glowing ' + (n === 1 ? 'key' : 'keys') + ', and ' + SETTINGS_INFO[street].line + '.',\n    indexLine:n ? word + ' ' + (n === 1 ? 'key on this board opens' : 'keys on this board open') + ' something.' : 'Nothing on this board yet.',\n    street, tod, introFrom:Math.max(0, tod - 0.18), preview\n  };\n  return {errors:[], fields, products, order, keyOf, slotOf, meta};\n}\n\nfunction applyMeta(m){\n  document.title = m.title;\n  const d = document.querySelector('meta[name=\"description\"]'); if (d) d.setAttribute('content', m.description);\n  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };\n  set('brandName', m.name); set('brandSub', m.subtitle); set('introKick', m.kicker); set('introName', m.name);\n  set('introLine', m.line); set('idxKick', m.indexLine);\n  const s = document.getElementById('brandSub'); if (s) s.style.display = m.subtitle ? '' : 'none';\n}\n\nfunction showErrors(list){\n  const intro = document.getElementById('intro');\n  intro.classList.add('broken');\n  const box = document.getElementById('introErr');\n  box.innerHTML = '\u003cp class=\"eh\">This portfolio could not be built yet.\u003c/p>\u003cul>' + list.map(e => '\u003cli>' + esc(e) + '\u003c/li>').join('') +\n    '\u003c/ul>\u003cp class=\"ef\">Fix these in the portfolio and reload.\u003c/p>';\n  if (window.console) console.warn('[portfolio]', list.join('\\n'));\n}\n\nfunction hasPortfolio(el){\n  if (!el) return false;\n  if (el.getAttribute('data-src')) return true;\n  const t = el.textContent.trim();\n  return t.length > 0 && t !== '{}';\n}\n\nfunction start(){\n  const el = document.getElementById('portfolio');\n  if (!hasPortfolio(el)){\n    if (window.KeystreetStudio) return window.KeystreetStudio.init(window.Keystreet);\n    return showErrors(['This file has no portfolio in it yet. Open it with the studio to build one.']);\n  }\n  const run = raw => {\n    const res = validatePortfolio(raw);\n    if (res.errors.length) return showErrors(res.errors);\n    applyMeta(res.meta);\n    try { boot(res.products, res.order, res.meta); }\n    catch (e){ showErrors(['The scene failed to start: ' + e.message]); if (window.console) console.error(e); }\n  };\n  const src = el.getAttribute('data-src');\n  if (src){\n    fetch(src).then(r => { if (!r.ok) throw new Error('Could not load ' + src + ' (HTTP ' + r.status + ').'); return r.json(); })\n      .then(run).catch(e => showErrors([e.message]));\n    return;\n  }\n  let raw;\n  try { raw = JSON.parse(el.textContent); }\n  catch (e){ return showErro <!--KS:STUDIO-->
<style>
/* Studio: a glass panel of guided questions beside the live keyboard.
   Shares the viewer's night palette; amber marks what the studio asks of you. */
:root{
  color-scheme:dark;
  --panel:rgba(11,16,36,.88);
  --field:rgba(242,240,234,.06);
  --fieldH:rgba(242,240,234,.1);
  --line:rgba(242,240,234,.12);
  --ok:#86D3AE;
  --warn:#F2BE72;
  --err:#FF9D8A;
  --kw:448px;
}
body.studio #intro,body.studio:not(.visitor) #brand,body.studio:not(.visitor) #progress,body.studio:not(.visitor) #hint{display:none}
body.studio.visitor #intro{display:grid}
body.studio.visitor #ks{display:none}
body.studio #panel{width:min(390px,30vw)}
#ks{position:fixed;z-index:9;top:16px;left:16px;bottom:16px;width:var(--kw);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--hair);border-radius:24px;
  backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);
  box-shadow:0 30px 80px rgba(3,6,18,.45);color:var(--wash);font-family:var(--sans);overflow:hidden}
#ks *{box-sizing:border-box}
:where(#ks) button{font:inherit;color:inherit;cursor:pointer}
#ks :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ks-top{padding:20px 24px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.ks-brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ks-brand b{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1;letter-spacing:.005em}
.ks-brand b i{font-style:italic;color:var(--mute)}
.ks-saved{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:7px;white-space:nowrap}
.ks-saved::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok);opacity:.8}
.ks-saved.off::before{background:var(--faint)}
.ks-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;margin:0;padding:0}
.ks-steps button{width:100%;background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:7px}
.ks-steps i{display:block;height:3px;border-radius:3px;background:var(--line);transition:background .4s}
.ks-steps span{font-size:12px;color:var(--faint);transition:color .3s}
.ks-steps .done i{background:rgba(255,184,103,.45)}
.ks-steps .now i{background:var(--amber)}
.ks-steps .now span{color:var(--wash)}
.ks-body{flex:1;overflow-y:auto;padding:24px 24px 28px;scrollbar-width:thin;scrollbar-color:rgba(242,240,234,.2) transparent}
.ks-q{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.04;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}
.ks-help{font-size:14px;line-height:1.55;color:var(--mute);margin:0 0 22px;max-width:46ch}
.ks-field{display:flex;flex-direction:column;gap:7px;margin:0 0 18px}
.ks-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:500}
.ks-label .opt{font-weight:400;color:var(--faint);font-size:12px}
.best{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--amber);white-space:nowrap}
.best::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
#ks input[type=text],#ks input[type=url],#ks textarea,#ks select{width:100%;background:var(--field);border:1px solid transparent;border-radius:12px;
  padding:11px 13px;color:var(--wash);font:inherit;font-size:14.5px;line-height:1.45;transition:background .2s,border-color .2s}
#ks textarea{resize:vertical;min-height:96px}
#ks input::placeholder,#ks textarea::placeholder{color:rgba(242,240,234,.32)}
#ks input:hover,#ks textarea:hover,#ks select:hover{background:var(--fieldH)}
#ks input:focus,#ks textarea:focus,#ks select:focus{outline:none;border-color:rgba(255,184,103,.55);background:var(--fieldH)}
#ks select option{background:#141a33}
.ks-hint{font-size:12.5px;line-height:1.5;color:var(--faint)}
.ks-err{font-size:12.5px;line-height:1.45;color:var(--err)}
.ks-count{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.ks-count.over{color:var(--err)}
.ks-sep{height:1px;background:var(--line);margin:22px 0}
/* settings */
.ks-places{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 26px}
.ks-place{position:relative;display:flex;flex-direction:column;background:var(--field);border:1px solid transparent;border-radius:16px;padding:0;
  overflow:hidden;text-align:left;transition:border-color .25s,transform .25s var(--ease)}
.ks-place svg{display:block;width:100%;height:auto;aspect-ratio:16/10}
.ks-place .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.ks-place b{font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.1}
.ks-place small{font-size:12px;line-height:1.4;color:var(--faint)}
.ks-place:hover:not([disabled]){transform:translateY(-2px)}
.ks-place.on{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,184,103,.14)}
.ks-place[disabled]{cursor:default;opacity:.55}
.ks-place .soon{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 7px;border-radius:6px;background:rgba(8,12,28,.7);color:var(--mute)}
.ks-chips{display:flex;flex-wrap:wrap;gap:7px}
.ks-chip{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;font-size:13px;color:var(--mute);transition:all .2s}
.ks-chip:hover{color:var(--wash);border-color:rgba(242,240,234,.3)}
.ks-chip.on{background:var(--wash);color:var(--night);border-color:var(--wash);font-weight:600}
/* projects */
.ks-empty{border:1px dashed rgba(242,240,234,.24);border-radius:18px;padding:26px 22px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.ks-empty p{margin:0;font-size:14px;line-height:1.55;color:var(--mute)}
.ks-cards{display:flex;flex-direction:column;gap:10px}
.ks-card{border-radius:16px;background:var(--field);border:1px solid transparent;transition:border-color .25s,background .25s}
.ks-card.open{background:rgba(242,240,234,.045);border-color:var(--line)}
.ks-card.bad{border-color:rgba(255,157,138,.4)}
.ks-head{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px 14px;text-align:left}
.ks-head .sw{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 12px currentColor}
.ks-head .nm{flex:1;min-width:0;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ks-head .nm.ph{color:var(--faint);font-weight:400}
.ks-kbd{font-family:var(--mono);font-size:11px;min-width:30px;text-align:center;padding:4px 7px;border-radius:7px;background:rgba(242,240,234,.1);color:var(--mute)}
.ks-head svg{width:16px;height:16px;stroke:var(--faint);fill:none;stroke-width:1.8;transition:transform .3s}
.ks-card.open .ks-head svg{transform:rotate(180deg)}
.ks-form{padding:4px 14px 16px}
.ks-card:not(.open) .ks-form{display:none}
.ks-minis{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ks-mini{aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:rgba(242,240,234,.05);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;padding:4px;transition:all .2s}
.ks-mini svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;color:var(--mute)}
.ks-mini span{font-size:9.5px;color:var(--faint);line-height:1.1;text-align:center}
.ks-mini:hover{background:rgba(242,240,234,.1)}
.ks-mini.on{border-color:var(--c,var(--amber));background:rgba(242,240,234,.1)}
.ks-mini.on svg{color:var(--c,var(--amber))}
.ks-swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ks-sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;background-clip:padding-box;transition:transform .2s}
.ks-sw:hover{transform:scale(1.12)}
.ks-sw.on{box-shadow:0 0 0 2px var(--night),0 0 0 4px var(--wash)}
.ks-custom{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);cursor:pointer}
.ks-custom input{width:26px;height:26px;border:0;padding:0;background:none;cursor:pointer}
.ks-facts{display:flex;flex-direction:column;gap:7px}
.ks-fact{display:grid;grid-template-columns:1fr 1fr auto;gap:7px}
.ks-x{background:none;border:0;color:var(--faint);padding:0 6px;font-size:18px;line-height:1}
.ks-x:hover{color:var(--wash)}
.ks-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ks-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ks-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
/* buttons */
.ks-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 16px;font-size:13.5px;
  border:1px solid var(--line);background:none;color:var(--mute);transition:all .2s}
.ks-btn:hover{color:var(--wash);border-color:rgba(242,240,234,.32)}
.ks-btn[disabled]{opacity:.4;cursor:default}
.ks-btn.primary{background:var(--wash);border-color:var(--wash);color:var(--night);font-weight:600}
.ks-btn.primary:hover{box-shadow:0 0 0 5px rgba(242,240,234,.13)}
.ks-btn.amber{background:var(--amber);border-color:var(--amber);color:#2A1A08;font-weight:600}
.ks-btn.amber:hover{box-shadow:0 0 0 5px rgba(255,184,103,.2)}
.ks-btn.danger{color:var(--err);border-color:rgba(255,157,138,.35)}
.ks-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ks-link{background:none;border:0;padding:0;color:var(--mute);text-decoration:underline;text-underline-offset:3px;font-size:13px}
.ks-link:hover{color:var(--wash)}
.ks-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
/* publish */
.ks-check{list-style:none;margin:0 0 20px;padding:0;display:flex;flex-direction:column;gap:9px}
.ks-check li{display:grid;grid-template-columns:18px 1fr;gap:10px;font-size:14px;line-height:1.5;color:var(--mute)}
.ks-check li::before{content:'';width:9px;height:9px;margin-top:6px;border-radius:50%;background:var(--ok)}
.ks-check li.warn::before{background:var(--warn)}
.ks-check li.bad::before{background:var(--err)}
.ks-check b{color:var(--wash);font-weight:500}
.ks-big{display:flex;flex-direction:column;gap:9px;margin:0 0 20px}
.ks-big .ks-btn{justify-content:flex-start;padding:14px 18px;border-radius:16px;font-size:14.5px}
.ks-big .ks-btn small{display:block;font-weight:400;font-size:12.5px;opacity:.72;margin-top:2px}
.ks-big .ks-btn span{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.ks-note{font-size:13px;line-height:1.55;color:var(--mute);margin:0 0 10px}
.ks-code{position:relative;font-family:var(--mono);font-size:12px;line-height:1.7;background:rgba(0,0,0,.28);border-radius:12px;padding:12px 14px;
  margin:0 0 12px;overflow-x:auto;white-space:pre;color:#DCD6C8}
.ks-toast{position:fixed;z-index:40;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--wash);color:var(--night);font-size:13.5px;font-weight:500;padding:11px 18px;border-radius:999px;transition:all .35s var(--ease)}
.ks-toast.on{opacity:1;transform:translate(-50%,0)}
.ks-confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
/* the curtain while a street is rebuilt */
#ks-fade{position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 100%,#3A3F6E 0%,#1A2146 46%,#0B1128 100%);transition:opacity .35s ease}
#ks-fade.on{opacity:1}
#ks-fade p{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--mute);margin:0 0 0 var(--kw)}
#ks-back{position:fixed;z-index:30;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none}
body.visitor #ks-back{display:inline-flex}
@media (max-width:899px){
  :root{--kw:0px}
  #ks{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:58vh;border-radius:22px}
  .ks-q{font-size:28px}
  .ks-body{padding:20px 18px 24px}
  .ks-top{padding:16px 18px 12px}
  #ks-fade p{margin:0 0 40vh;font-size:22px}
  .ks-minis{grid-template-columns:repeat(5,1fr)}
}
@media (max-width:420px){ .ks-grid2{grid-template-columns:1fr} .ks-places{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){ #ks *,#ks-fade{transition:none !important} }

function blank(){ return {owner:{name:'', subtitle:''}, intro:{}, scene:{theme:'keyboard', setting:'santorini', timeOfDay:'blue'}, projects:[]}; }
function normalize(raw){
  const s = blank();
  if (!raw || typeof raw !== 'object') return s;
  const o = raw.owner || {}, sc = raw.scene || {};
  s.owner.name = String(o.name || ''); s.owner.subtitle = String(o.subtitle || '');
  if (o.title) s.owner.title = String(o.title);
  if (o.description) s.owner.description = String(o.description);

  s.scene.setting = String(sc.setting || sc.street || 'santorini').toLowerCase();
  if (!KS.settings[s.scene.setting] || !KS.settings[s.scene.setting].ready) s.scene.setting = 'santorini';
  const t = sc.timeOfDay;

  s.projects = (Array.isArray(raw.projects) ? raw.projects : []).slice(0, KS.max).map(p => ({
    name:String(p.name || ''), lede:String(p.lede || ''), category:String(p.category || ''), miniature:String(p.miniature || ''),

  }));
  return s;
}
/* the portfolio as it will be written into the file: empty fields left out */
function portfolio(){
  const out = {version:1, owner:{name:state.owner.name.trim()}, scene:{theme:'keyboard', setting:state.scene.setting, timeOfDay:state.scene.timeOfDay}};
  for (const k of ['subtitle', 'title', 'description']) if (state.owner[k] && state.owner[k].trim()) out.owner[k] = state.owner[k].trim();
  const intro = {};
  for (const k of ['kicker', 'line']) if (state.intro[k] && String(state.intro[k]).trim()) intro[k] = String(state.intro[k]).trim();
  if (Object.keys(intro).length) out.intro = intro;
  out.projects = state.projects.map(p => {
    const q = {name:p.name.trim()};
    for (const k of ['key', 'category', 'color', 'url', 'miniature', 'lede']) if (p[k] && p[k].trim()) q[k] = p[k].trim();
    const body = p.body.map(t => t.trim()).filter(Boolean); if (body.length) q.body = body;
    const facts = p.facts.filter(f => f[0].trim() && f[1].trim()).map(f => [f[0].trim(), f[1].trim()]); if (facts.length) q.facts = facts;
    const tags = p.tags.map(t => t.trim()).filter(Boolean); if (tags.length) q.tags = tags;
    return q;
  });
  return out;
}
function save(){

    el.textContent = storageOk ? 'Saved in this browser' : 'Not saved: this browser blocks storage';
  }, 350);
}
function restore(){
  try { const raw = localStorage.getItem(STORE); if (raw){ const d = JSON.parse(raw); return {state:normalize(d.state), step:d.step | 0}; } } catch (_){ storageOk = false; }
  return null;
}

/* ── the live scene ─────────────────────────────────────── */
function signature(r){ return r.meta.street + '|' + r.order.map(k => k + ':' + r.products[k].arche).join(','); }
function insets(){ return wide() ? [($('ks').offsetWidth || 448) + 16, 0] : [0, Math.round(innerHeight*0.58)]; }
function refresh(){
  res = KS.validate(portfolio(), {preview:true});
  if (res.errors.length){ markErrors(); return; }
  KS.applyMeta(res.meta);
  markErrors();
  const s = signature(res);
  if (!engine || s !== sig){ clearTimeout(timer); timer = setTimeout(() => rebuild(), engine ? 420 : 0); return; }
  engine.update(res.products);
  if (lastTod !== res.meta.tod){ lastTod = res.meta.tod; engine.setTod(res.meta.tod); }
}
function rebuild(asVisitor){
  if (!res || res.errors.length) return;
  const fade = $('ks-fade');
  $('ks-fade-tx').textContent = 'Setting the scene in ' + KS.settings[res.meta.street].label;
  const go = () => {
    if (engine){ engine.dispose(); engine = null; }
    const meta = Object.assign({}, res.meta, {preview:!asVisitor});
    const intro = document.getElementById('intro'); intro.classList.remove('gone', 'ready', 'broken');
    if (asVisitor) document.body.classList.remove('live');
    try { engine = KS.boot(res.products, res.order, meta); }
    catch (e){ console.error(e); toast('The scene could not start: ' + e.message); building = false; return; }
    sig = signature(res); lastTod = res.meta.tod;
    if (!asVisitor){ const [l, b] = insets(); engine.setInsets(l, b, true); if (openCard >= 0) focusCard(openCard); }
    setTimeout(() => { fade.classList.remove('on'); building = false; }, 160);
  };
  building = true;
  if (!engine){ go(); return; }
  fade.classList.add('on'); setTimeout(go, 360);
}
function focusCard(i){
  if (!engine || !res) return;
  const slot = res.slotOf[i];
  if (slot === undefined){ engine.home(); return; }
  if (wide()) engine.focus(slot); else engine.look(slot);
}

  $('ks-next').classList.toggle('amber', step === 3); $('ks-next').classList.toggle('primary', step !== 3);
}

/* ── editing ────────────────────────────────────────────── */
function setPath(path, v){
  const parts = path.split('.');
  if (parts[0] === 'p'){
    const p = state.projects[+parts[1]], k = parts[2];
    if (!p) return;
    if (k === 'body') p.body = v.split(/\n\s*\n/);
    else if (k === 'tags') p.tags = v.split(',');
    else if (k === 'facts') p.facts[+parts[3]][+parts[4]] = v;
    else p[k] = v;
    if (k === 'name'){ const nm = document.querySelector('#ks .ks-card[data-i="' + parts[1] + '"] .nm'); if (nm){ nm.textContent = v.trim() || 'Untitled project'; nm.classList.toggle('ph', !v.trim()); } }
    return;
  }
  let o = state; for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = o[parts[i]] || {};
  o[parts[parts.length - 1]] = v;
}
function changed(){ save(); refresh(); }
function addProject(){
  if (state.projects.length >= KS.max) return;
  const used = new Set(state.projects.map(p => (p.miniature || '').toLowerCase()));
  const mini = KS.miniatures.find(m => !used.has(m)) || 'lantern';
  state.projects.push({name:'', lede:'', category:'', miniature:mini, color:KS.colors[state.projects.length % KS.colors.length], url:'', key:'', body:[], facts:[], tags:[]});
  openCard = state.projects.length - 1; pendingRemove = -1;
  render(true); changed();
  const el = $('p' + openCard + '-name'); if (el) el.focus({preventScroll:false});
}
function onClick(e){
  const t = e.target.closest('button,[data-step]'); if (!t || !$('ks').contains(t)) return;
  const d = t.dataset, cardEl = t.closest('.ks-card'), i = cardEl ? +cardEl.dataset.i : -1;
  if (d.step !== undefined){ go(+d.step); return; }
  if (d.setting){ state.scene.setting = d.setting; render(true); changed(); return; }
  if (d.tod){ state.scene.timeOfDay = d.tod; document.querySelectorAll('#ks [data-tod]').forEach(b => { b.classList.toggle('on', b === t); b.setAttribute('aria-pressed', b === t); }); changed(); return; }
  if (d.card !== undefined){ const c = +d.card; openCard = openCard === c ? -1 : c; pendingRemove = -1; render(true); if (openCard >= 0) focusCard(openCard); else if (engine){ engine.release && engine.release(); engine.home(); } return; }
  if (d.add !== undefined){ addProject(); return; }
  if (d.example !== undefined){
    const ex = normalize(Object.assign({}, EXAMPLE, {scene:state.scene}));
    if (!state.owner.name.trim()){ state.owner = ex.owner; state.intro = ex.intro; }
    state.projects = ex.projects; openCard = -1; render(); changed(); toast('Example projects added. Replace them with your own.'); return;
  }
  if (d.mini && i >= 0){ state.projects[i].miniature = d.mini; render(true); changed(); return; }
  if (d.color && i >= 0){ state.projects[i].color = d.color; cardEl.querySelectorAll('.ks-sw').forEach(s => s.classList.toggle('on', s === t)); cardEl.style.setProperty('--c', d.color); const sw = cardEl.querySelector('.ks-head .sw'); sw.style.background = sw.style.color = d.color; changed(); return; }
  if (d.addfact !== undefined && i >= 0){ state.projects[i].facts.push(['', '']); render(true); changed(); return; }
  if (d.delfact !== undefined && i >= 0){ state.projects[i].facts.splice(+d.delfact, 1); render(true); changed(); return; }
  if (d.move && i >= 0){
    const j = i + (+d.move); if (j < 0 || j >= state.projects.length) return;
    const a = state.projects; [a[i], a[j]] = [a[j], a[i]]; openCard = j; render(true); changed(); return;
  }
  if (d.remove && i >= 0){
    if (d.remove === 'ask'){ pendingRemove = i; render(true); return; }
    if (d.remove === 'no'){ pendingRemove = -1; render(true); return; }
    state.projects.splice(i, 1); pendingRemove = -1; openCard = -1; render(true); changed(); if (engine) engine.home(); return;
  }
  if (d.dl){ download(d.dl); return; }
  if (d.visitor !== undefined){ showVisitor(); return; }
  if (d.reset){
    if (d.reset === 'ask'){ confirmReset = true; render(true); return; }
    if (d.reset === 'no'){ confirmReset = false; render(true); return; }
    confirmReset = false; state = blank(); openCard = -1; step = 0; render(); changed(); toast('Started over.'); return;
  }
}
function onInput(e){
  const t = e.target;
  if (t.dataset.colorpick !== undefined){
    const cardEl = t.closest('.ks-card'), i = +cardEl.dataset.i;
    state.projects[i].color = t.value.toUpperCase(); cardEl.querySelectorAll('.ks-sw').forEach(s => s.classList.remove('on'));
    cardEl.style.setProperty('--c', t.value); const sw = cardEl.querySelector('.ks-head .sw'); sw.style.background = sw.style.color = t.value;
    changed(); return;
  }
  if (!t.dataset.bind) return;
  setPath(t.dataset.bind, t.value);
  const c = document.querySelector('#ks [data-count="' + t.id + '"]');
  if (c){ const max = +(t.dataset.max || (t.id.endsWith('lede') ? 160 : 80)); c.textContent = t.value.length + ' / ' + max; c.classList.toggle('over', t.value.length > max); }
  if (t.tagName === 'SELECT'){ render(true); }
  changed();
}
function onChange(e){
  const t = e.target;
  /* a name settles its key: while typing, the key follows the first letter; once the field
     is left, it stays put so later renames never move the project around the board */
  const m = t.dataset && t.dataset.bind && t.dataset.bind.match(/^p\.(\d+)\.name$/);
  if (m){
    const i = +m[1], p = state.projects[i];
    if (p && !p.key && p.name.trim() && res && res.keyOf && res.keyOf[i]){ p.key = res.keyOf[i]; save(); }
    return;
  }
  if (t.id !== 'f-load' || !t.files || !t.files[0]) return;
  const file = t.files[0], fr = new FileReader();
  fr.onload = () => {
    let text = String(fr.result), raw = null;
    try {
      if (/<html|<script/i.test(text)){
        const m = text.match(/<script type="application\/json" id="portfolio">([\s\S]*?)<\/script>/);
        if (!m || !m[1].trim()) throw new Error('That file has no portfolio inside it.');
        text = m[1].replace(/<\\\//g, '</');
      }
      raw = JSON.parse(text);
    } catch (err){ toast(err.message.indexOf('portfolio') >= 0 ? err.message : 'That file could not be read as a portfolio.'); return; }
    state = normalize(raw); openCard = -1; render(); changed(); toast('Opened ' + file.name + '.');
  };
  fr.readAsText(file);
}
function go(n){
  step = Math.max(0, Math.min(3, n)); pendingRemove = -1; confirmReset = false;
  if (step !== 2 && openCard >= 0){ openCard = -1; if (engine){ engine.release && engine.release(); engine.home(); } }
  render(); save();
}

  if (window.claude && typeof window.claude.use === 'function'){
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (_){}
    if (!dl){ toast('Downloads are not available in this view.'); return false; }
    try { await dl.save({filename:name, data:text}); return true; }
    catch (err){
      const code = err && err.code;
      if (code === 'declined') return false;
      if (code === 'rate_limited') toast('A save is already waiting for your answer.');
      else toast('The download did not start' + (err && err.message ? ': ' + err.message : '.'));
      return false;
    }
  }
  if (!window.URL || !URL.createObjectURL){ toast('This browser cannot save files from here.'); return false; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:mime})); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}
async function download(kind){
  if (kind === 'site'){
    if (!ready()){ toast('Fix the red items first.'); return; }
    if (await saveFile('index.html', siteHTML(), 'text/html')) toast('Downloaded index.html.');
  } else {
    if (await saveFile('portfolio.json', JSON.stringify(portfolio(), null, 2), 'application/json')) toast('Saved portfolio.json.');
  }
}
function showVisitor(){
  visitor = true; document.body.classList.add('visitor');
  if (engine) engine.setInsets(0, 0);
  rebuild(true);
}
function hideVisitor(){
  visitor = false; document.body.classList.remove('visitor');
  document.body.classList.add('live');
  rebuild(false);
}

/* ── start ──────────────────────────────────────────────── */
window.KeystreetStudio = {
  init(K){
    KS = K;
    const saved = restore();
    if (saved){ state = saved.state; step = Math.min(3, saved.step); }
    else state = blank();
    document.body.classList.add('studio', 'live');
    $('ks').hidden = false;
    $('ks').addEventListener('click', onClick);
    $('ks').addEventListener('input', onInput);
    $('ks').addEventListener('change', onChange);
    $('ks-prev').addEventListener('click', () => go(step - 1));
    $('ks-next').addEventListener('click', () => { if (step === 3) download('site'); else go(step + 1); });
    $('ks-back').addEventListener('click', hideVisitor);
    let rz = 0;
    addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (engine && !visitor){ const [l, b] = insets(); engine.setInsets(l, b); } }, 200); });
    res = KS.validate(portfolio(), {preview:true});
    render();
    refresh();
  },
  /* for tests and tooling */
  _debug(){ return {state, res, step, openCard, engine, siteHTML, portfolio}; }
};
})();
</script>
